# Related-work table of jaw-motion trackers for the systems paper (J7 -> a table view).
# BibTeX: docs/analysis/references.bib.
#
# Every row is quoted from the abstract or open full text of the cited source (named in
# `note`); null = not reported there (never filled in from manufacturer brochures or memory).
# Fields:
#   system            name or short description
#   principle         optical | optoelectronic | ultrasonic | electromagnetic | magnetic | inertial | mixed
#   dof               degrees of freedom tracked (6 = rigid-body pose), null if the source does not state it
#   rate_hz           sampling rate as stated in the source; null if not stated
#   accuracy          the reported figure, as text (units inside)
#   accuracy_kind     trueness | precision | rmse | loa | agreement | event_timing | none
#   reference_system  what it was compared with
#   wearable          true when the whole system is worn (no external camera, emitter or field source)
#   in_vivo           true when the accuracy figure comes from people, false from a bench or phantom
#   key, note
# The JTS-MM row is not here: it comes from numbers_systems.yaml (macros), never typed by hand.
# Accuracy kinds differ (static trueness on a phantom vs in-vivo agreement), so the view should
# print accuracy_kind and in_vivo next to every figure and never rank the rows by the number.

rows:
