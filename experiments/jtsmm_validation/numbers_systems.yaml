alignedIncisorMean: {"mean_of": ["alignedIncisorPOne", "alignedIncisorPTwo"], "text": "frame-aligned incisor RMS, pooled, mean (POne, PTwo); descriptive, n = 2"}
alignedRotationPTwo: {"source": "ref_kinematics:segments_aligned", "column": "rot_rms_deg", "filter": {"pid": "s14", "segment": "movement_pooled"}, "fmt": ".2f", "unit": "\\degree", "text": "frame-aligned rotation RMS, pooled, PTwo"}
