fusionOpticalOpenClosePOne: {"source": "ref_fusion:segments", "column": "incisor_aligned_rms_mm", "filter": {"pid": "s10", "segment": "open_close", "estimator": "F0", "query": "frames"}, "fmt": ".2f", "unit": "\\milli\\metre", "text": "aligned incisor RMS, open-close, estimator F0, POne"}
fusionKalmanOpenClosePOne: {"source": "ref_fusion:segments", "column": "incisor_aligned_rms_mm", "filter": {"pid": "s10", "segment": "open_close", "estimator": "F2", "query": "frames"}, "fmt": ".2f", "unit": "\\milli\\metre", "text": "aligned incisor RMS, open-close, estimator F2, POne"}
