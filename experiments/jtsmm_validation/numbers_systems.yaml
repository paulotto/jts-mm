# In-text numbers of the systems paper; see numbers_dataset.yaml for the format.
# Participant keys use the pseudonyms (POne = P1, PTwo = P2); filters use the study ids.

# -- clock, CT labels, tip --
clockDriftPOne: {"source": "ref_sync:sync", "column": "alpha_ppm", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "", "text": "clock drift alpha (ppm), POne"}
clockDriftSePOne: {"source": "ref_sync:sync", "column": "se_alpha_ppm_hac", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "", "text": "SE of the drift (HAC from per-window offsets, ppm, VD19), POne"}
clockOffsetSePOne: {"source": "ref_sync:sync", "column": "se_offset_ms_hac", "filter": {"pid": "s10"}, "fmt": ".2f", "unit": "\\milli\\second", "text": "SE of the clock offset (HAC from per-window offsets, VD19), POne"}
ctSwappedPOne: {"source": "ref_quality:label_correction", "column": "n_swapped", "filter": {"pid": "s10", "body": "CT"}, "fmt": "d", "unit": "", "text": "CT frames with swapped labels, POne"}
ctFramesPOne: {"source": "ref_quality:label_correction", "column": "n_frames", "filter": {"pid": "s10", "body": "CT"}, "fmt": "d", "unit": "", "text": "CT frames, POne"}
tipAgreePOne: {"source": "ref_tip:tip_decision", "column": "p_agree", "filter": {"pid": "s10"}, "fmt": ".2f", "unit": "", "text": "agreement probability of the tip estimates, POne"}
clockDriftPTwo: {"source": "ref_sync:sync", "column": "alpha_ppm", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "", "text": "clock drift alpha (ppm), PTwo"}
clockDriftSePTwo: {"source": "ref_sync:sync", "column": "se_alpha_ppm_hac", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "", "text": "SE of the drift (HAC from per-window offsets, ppm, VD19), PTwo"}
clockOffsetSePTwo: {"source": "ref_sync:sync", "column": "se_offset_ms_hac", "filter": {"pid": "s14"}, "fmt": ".2f", "unit": "\\milli\\second", "text": "SE of the clock offset (HAC from per-window offsets, VD19), PTwo"}
ctSwappedPTwo: {"source": "ref_quality:label_correction", "column": "n_swapped", "filter": {"pid": "s14", "body": "CT"}, "fmt": "d", "unit": "", "text": "CT frames with swapped labels, PTwo"}
ctFramesPTwo: {"source": "ref_quality:label_correction", "column": "n_frames", "filter": {"pid": "s14", "body": "CT"}, "fmt": "d", "unit": "", "text": "CT frames, PTwo"}
tipAgreePTwo: {"source": "ref_tip:tip_decision", "column": "p_agree", "filter": {"pid": "s14"}, "fmt": ".2f", "unit": "", "text": "agreement probability of the tip estimates, PTwo"}
# -- (I) point marking --
markFrameMaxPOne: {"source": "ref_landmarks:marking_summary", "column": "frame_max_deg", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "\\degree", "text": "maxillary frame error from the marks, POne"}
markFrameMandPOne: {"source": "ref_landmarks:marking_summary", "column": "frame_mand_deg", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "\\degree", "text": "mandibular frame error from the marks, POne"}
markRestOffsetPOne: {"source": "ref_landmarks:marking_summary", "column": "rest_incisor_offset_mm", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "incisor offset at rest from the marking, POne"}
markRestRotationPOne: {"source": "ref_landmarks:marking_summary", "column": "rest_rotation_offset_deg", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "\\degree", "text": "rotation offset at rest from the marking, POne"}
markToothDistPOne: {"source": "ref_landmarks:marking_summary", "column": "rms_dist_diff_teeth_mm", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "RMS difference of the within-body tooth distances, POne"}
markPointTeethPOne: {"source": "ref_landmarks:marking_summary", "column": "rms_teeth_mm", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "registered tooth point error (RMS), POne"}
markPointCondylePOne: {"source": "ref_landmarks:marking_summary", "column": "rms_condyle_mm", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "registered condyle point error (RMS), POne"}
markPrecJtsmmPOne: {"source": "ref_landmarks:marking_summary", "column": "precision_jtsmm_mad_mm", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "static precision JTS-MM (MAD), POne"}
markPrecQualisysPOne: {"source": "ref_landmarks:marking_summary", "column": "precision_qualisys_mad_mm", "filter": {"pid": "s10"}, "fmt": ".2f", "unit": "\\milli\\metre", "text": "static precision Qualisys (MAD), POne"}
markSigmaRefTeethPOne: {"source": "ref_landmarks:marking_summary", "column": "sigma_ref_teeth_mm", "filter": {"pid": "s10"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "reference uncertainty of the tooth landmarks, POne"}
motionFrameMaxPOne: {"source": "ref_kinematics:frame_offsets", "column": "rot_deg", "filter": {"pid": "s10", "transform": "A_maxillary", "fold": ["open_close", "protrusion_retrusion", "left_right", "chewing", "free_motion"]}, "agg": "median", "fmt": ".1f", "unit": "\\degree", "text": "maxillary frame offset from motion (median over the leave-one-task-out folds), POne"}
motionFrameMandPOne: {"source": "ref_kinematics:frame_offsets", "column": "rot_deg", "filter": {"pid": "s10", "transform": "B_mandibular", "fold": ["open_close", "protrusion_retrusion", "left_right", "chewing", "free_motion"]}, "agg": "median", "fmt": ".1f", "unit": "\\degree", "text": "mandibular frame offset from motion (median over the leave-one-task-out folds), POne"}
markFrameMaxPTwo: {"source": "ref_landmarks:marking_summary", "column": "frame_max_deg", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "\\degree", "text": "maxillary frame error from the marks, PTwo"}
markFrameMandPTwo: {"source": "ref_landmarks:marking_summary", "column": "frame_mand_deg", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "\\degree", "text": "mandibular frame error from the marks, PTwo"}
markRestOffsetPTwo: {"source": "ref_landmarks:marking_summary", "column": "rest_incisor_offset_mm", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "incisor offset at rest from the marking, PTwo"}
markRestRotationPTwo: {"source": "ref_landmarks:marking_summary", "column": "rest_rotation_offset_deg", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "\\degree", "text": "rotation offset at rest from the marking, PTwo"}
markToothDistPTwo: {"source": "ref_landmarks:marking_summary", "column": "rms_dist_diff_teeth_mm", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "RMS difference of the within-body tooth distances, PTwo"}
markPointTeethPTwo: {"source": "ref_landmarks:marking_summary", "column": "rms_teeth_mm", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "registered tooth point error (RMS), PTwo"}
markPointCondylePTwo: {"source": "ref_landmarks:marking_summary", "column": "rms_condyle_mm", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "registered condyle point error (RMS), PTwo"}
markPrecJtsmmPTwo: {"source": "ref_landmarks:marking_summary", "column": "precision_jtsmm_mad_mm", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "static precision JTS-MM (MAD), PTwo"}
markPrecQualisysPTwo: {"source": "ref_landmarks:marking_summary", "column": "precision_qualisys_mad_mm", "filter": {"pid": "s14"}, "fmt": ".2f", "unit": "\\milli\\metre", "text": "static precision Qualisys (MAD), PTwo"}
markSigmaRefTeethPTwo: {"source": "ref_landmarks:marking_summary", "column": "sigma_ref_teeth_mm", "filter": {"pid": "s14"}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "reference uncertainty of the tooth landmarks, PTwo"}
motionFrameMaxPTwo: {"source": "ref_kinematics:frame_offsets", "column": "rot_deg", "filter": {"pid": "s14", "transform": "A_maxillary", "fold": ["open_close", "protrusion_retrusion", "left_right", "chewing", "free_motion"]}, "agg": "median", "fmt": ".1f", "unit": "\\degree", "text": "maxillary frame offset from motion (median over the leave-one-task-out folds), PTwo"}
motionFrameMandPTwo: {"source": "ref_kinematics:frame_offsets", "column": "rot_deg", "filter": {"pid": "s14", "transform": "B_mandibular", "fold": ["open_close", "protrusion_retrusion", "left_right", "chewing", "free_motion"]}, "agg": "median", "fmt": ".1f", "unit": "\\degree", "text": "mandibular frame offset from motion (median over the leave-one-task-out folds), PTwo"}
# -- (II) motion, own frames and aligned --
ownIncisorPOne: {"source": "ref_kinematics:segments", "column": "incisor_rms_mm", "filter": {"pid": "s10", "segment": "movement_pooled", "gated": true}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "own-frame incisor RMS, movement tasks pooled, gated, POne"}
ownRotationPOne: {"source": "ref_kinematics:segments", "column": "rot_rms_deg", "filter": {"pid": "s10", "segment": "movement_pooled", "gated": true}, "fmt": ".1f", "unit": "\\degree", "text": "own-frame rotation RMS, POne"}
ownCondyleLeftPOne: {"source": "ref_kinematics:segments", "column": "tmj_left_rms_mm", "filter": {"pid": "s10", "segment": "movement_pooled", "gated": true}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "own-frame left condyle RMS, POne"}
ownCondyleRightPOne: {"source": "ref_kinematics:segments", "column": "tmj_right_rms_mm", "filter": {"pid": "s10", "segment": "movement_pooled", "gated": true}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "own-frame right condyle RMS, POne"}
alignedIncisorPOne: {"source": "ref_kinematics:segments_aligned", "column": "incisor_rms_mm", "filter": {"pid": "s10", "segment": "movement_pooled"}, "fmt": ".2f", "unit": "\\milli\\metre", "text": "frame-aligned incisor RMS, pooled, POne"}
alignedRotationPOne: {"source": "ref_kinematics:segments_aligned", "column": "rot_rms_deg", "filter": {"pid": "s10", "segment": "movement_pooled"}, "fmt": ".2f", "unit": "\\degree", "text": "frame-aligned rotation RMS, pooled, POne"}
freeIncisorPOne: {"source": "ref_kinematics:segments_aligned_freemotion", "column": "incisor_rms_mm", "filter": {"pid": "s10", "segment": "protocol_pooled"}, "fmt": ".2f", "unit": "\\milli\\metre", "text": "incisor RMS with the alignment from free motion only, POne"}
freeRotationPOne: {"source": "ref_kinematics:segments_aligned_freemotion", "column": "rot_rms_deg", "filter": {"pid": "s10", "segment": "protocol_pooled"}, "fmt": ".2f", "unit": "\\degree", "text": "rotation RMS with the alignment from free motion only, POne"}
ownIncisorPTwo: {"source": "ref_kinematics:segments", "column": "incisor_rms_mm", "filter": {"pid": "s14", "segment": "movement_pooled", "gated": true}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "own-frame incisor RMS, movement tasks pooled, gated, PTwo"}
ownIncisorMean: {"mean_of": ["ownIncisorPOne", "ownIncisorPTwo"], "text": "own-frame incisor RMS, movement tasks pooled, gated, mean (POne, PTwo); descriptive, n = 2"}
ownRotationPTwo: {"source": "ref_kinematics:segments", "column": "rot_rms_deg", "filter": {"pid": "s14", "segment": "movement_pooled", "gated": true}, "fmt": ".1f", "unit": "\\degree", "text": "own-frame rotation RMS, PTwo"}
ownRotationMean: {"mean_of": ["ownRotationPOne", "ownRotationPTwo"], "text": "own-frame rotation RMS, mean (POne, PTwo); descriptive, n = 2"}
ownCondyleLeftPTwo: {"source": "ref_kinematics:segments", "column": "tmj_left_rms_mm", "filter": {"pid": "s14", "segment": "movement_pooled", "gated": true}, "fmt": ".1f", "unit": "\\milli\\metre", "text": "own-frame left condyle RMS, PTwo"}
