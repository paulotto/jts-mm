cfOracleRotationRot: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: X5b_rotation, outcome: rmse_inc_mm_rot}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, camera-free rotation + optical translation (rotation-induced error), open-close and chewing (median over participants)"}
cfOracleRotationTrans: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: X5b_rotation, outcome: rmse_inc_mm_trans}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, camera-free rotation + optical translation (rotation-induced error), protrusion and laterotrusion (median over participants)"}
cfOracleTask: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: X5c, outcome: rmse_inc_mm}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, task-conditioned translation model (oracle class), all scored tasks (median over participants)"}
cfOracleTaskRot: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: X5c, outcome: rmse_inc_mm_rot}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, task-conditioned translation model (oracle class), open-close and chewing (median over participants)"}
cfOracleTaskTrans: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: X5c, outcome: rmse_inc_mm_trans}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, task-conditioned translation model (oracle class), protrusion and laterotrusion (median over participants)"}
cfOracleOwnRot: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: E4own, outcome: rmse_inc_mm_rot}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, own model E4own (reference of the oracle analyses), open-close and chewing"}
cfOracleOwnTrans: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: E4own, outcome: rmse_inc_mm_trans}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, own model E4own (reference of the oracle analyses), protrusion and laterotrusion"}
