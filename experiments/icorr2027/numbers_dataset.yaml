# -- C intent: event order, post hoc family C2-E (X6; stats_timing:c2e_cohort) ------------
# One row per hypothesis (filter key). Estimates: median over participants with its BCa CI
# (n = participants with >= min_usable usable channel-cycles; n_flagged: 3-4, counted, not
# tested). H1 (primary): intersection-union of locking (p_lock) and location against the bias
# margin delta (p_loc), p = the larger. H2 / H3 only if H1 is rejected (serial gatekeeping,
# Holm: p_adj; NaN = not tested). Supporting rows: Holm within their block (p_adj). Structure
# rows (cycle shuffle): effect size only, the cohort p is withheld (gate re-evaluation
# 2026-10-31). Resolve only after the r11 run (the r9 / r10 stores have no C2-E tables).
cTwoEHOne: {source: "stats_timing:c2e_cohort", filter: {key: h1}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".0f", unit: "\\milli\\second", text: "closers before the closing onset, both tasks pooled: median locked lead (H1)"}
# \numCTwoEHOneN (participants tested in H1, >= min_usable usable channel-cycles) comes from the
# n field of cTwoEHOne; a separate cTwoEHOneN key defined the macro twice.
cTwoEHOneFlagged: {source: "stats_timing:c2e_cohort", filter: {key: h1}, column: n_flagged, fmt: "d", unit: "", text: "participants flagged in H1 (3-4 usable channel-cycles; counted, not tested)"}
cTwoEHOneP: {source: "stats_timing:c2e_cohort", filter: {key: h1}, column: p, fmt: ".3f", unit: "", text: "H1 intersection-union p (larger of locking and location p)"}
cTwoEHOnePLock: {source: "stats_timing:c2e_cohort", filter: {key: h1}, column: p_lock, fmt: ".3f", unit: "", text: "H1 locking p (signed-rank, log IQR ratio < 0)"}
cTwoEHOnePLoc: {source: "stats_timing:c2e_cohort", filter: {key: h1}, column: p_loc, fmt: ".3f", unit: "", text: "H1 location p (signed-rank, locked lead minus delta > 0)"}
cTwoEHTwo: {source: "stats_timing:c2e_cohort", filter: {key: h2}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".0f", unit: "\\milli\\second", text: "closer release before the opening onset, open-close: median release lead (H2)"}
cTwoEHTwoP: {source: "stats_timing:c2e_cohort", filter: {key: h2}, column: p_adj, fmt: ".3f", unit: "", text: "H2 adjusted p (serial gatekeeping, Holm; -- = not tested)"}
cTwoEHThree: {source: "stats_timing:c2e_cohort", filter: {key: h3}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".0f", unit: "\\milli\\second", text: "closer release before the opening onset, chewing: median release lead (H3)"}
cTwoEHThreeP: {source: "stats_timing:c2e_cohort", filter: {key: h3}, column: p_adj, fmt: ".3f", unit: "", text: "H3 adjusted p (serial gatekeeping, Holm; -- = not tested)"}
cTwoEHOnePHolmFamily: {source: "stats_timing:c2e_cohort", filter: {key: h1}, column: p_holm_family, fmt: ".3f", unit: "", text: "H1 p, Holm over H1-H3 (post hoc multiplicity sensitivity; not the pre-specified gatekeeping)"}
cTwoEHTwoPHolmFamily: {source: "stats_timing:c2e_cohort", filter: {key: h2}, column: p_holm_family, fmt: ".3f", unit: "", text: "H2 p, Holm over H1-H3 (post hoc multiplicity sensitivity; not the pre-specified gatekeeping)"}
cTwoEHThreePHolmFamily: {source: "stats_timing:c2e_cohort", filter: {key: h3}, column: p_holm_family, fmt: ".3f", unit: "", text: "H3 p, Holm over H1-H3 (post hoc multiplicity sensitivity; not the pre-specified gatekeeping)"}
cTwoEDecision: {source: "stats_timing:c2e_cohort", filter: {key: decision}, column: hypothesis, text: "decision of the family: shown (post hoc), not shown or inconclusive (underpowered)"}
cTwoEDelta: {source: "stats_timing:c2e_cohort", filter: {key: decision}, column: bias_margin_ms, fmt: ".0f", unit: "\\milli\\second", text: "bias margin delta (synthetic location bias at a true lead of 0 + 8 ms latency; gate G4)"}
cTwoEAlpha: {source: "stats_timing:c2e_cohort", filter: {key: p4_alpha}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".0f", unit: "\\milli\\second", text: "supporting: closers before the angular-acceleration onset (P4), median"}
