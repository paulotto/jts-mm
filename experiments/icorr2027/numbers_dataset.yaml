# In-text numbers of the dataset paper. One entry per number in the manuscript;
# `biomech export --paper paper_dataset.yaml` (or `biomech numbers`) resolves them from the
# pinned snapshot into numbers.tex (\numKey, \numKeyVal, \numKeyCI, \numKeyN) and
# numbers.json. Never type a result into the manuscript: add it here.
# Keys: letters only. Fields: source (stage:table), filter (one row, or agg over the rows),
# column, ci, n (a column, an integer or {distinct: pid}; agg: participants), n_of (what n
# counts if not participants, e.g. channels), fmt, unit, scale, agg, text (what the number
# is); mean_of: [keyA, keyB] (descriptive mean of other numbers, the n = 2 rule). `cite:` at
# the end: numbers of the systems paper (biomech.viz.numbers).
# Reporting population: paper_dataset.yaml reads the reporting_population variant
# store, so every own number below is the 13 adults' value (cohort statistics recomputed
# without the participant recorded outside the protocol). The n = 14 values appear only as the `...All` robustness macros
# ("including the participant recorded outside the protocol"), the `primary` column of the reporting_population comparison.
# IMU outcomes (C3a angle, C2, X2-X4, C3b, camera-free) are identical (that participant has no jaw IMU),
# except the generic (leave-one-out) IMU models, whose training used that participant's optics (generic LoA).
# No `...Adults` macros (D30, superseded by D35).

# -- cohort -----------------------------------------------------------------------------------
cohortN: {source: "qc_cohort:demographics", column: n, fmt: "d", unit: "", text: "participants"}
cohortFemale: {source: "qc_cohort:demographics", column: n_female, fmt: "d", unit: "", text: "female participants"}
cohortMale: {source: "qc_cohort:demographics", column: n_male, fmt: "d", unit: "", text: "male participants"}
cohortAgeMean: {source: "qc_cohort:demographics", column: age_mean, fmt: ".1f", unit: "", text: "mean age (years)"}
cohortAgeSd: {source: "qc_cohort:demographics", column: age_sd, fmt: ".1f", unit: "", text: "SD of age (years)"}
cohortAgeMin: {source: "qc_cohort:demographics", column: age_min, fmt: ".0f", unit: "", text: "youngest participant (years)"}
cohortAgeMax: {source: "qc_cohort:demographics", column: age_max, fmt: ".0f", unit: "", text: "oldest participant (years)"}

# -- requirements (Table: requirements) -------------------------------------------------------
reqOpening: {source: "requirements:requirements", filter: {key: opening_mm}, column: value, n: n, fmt: "req", unit: "\\milli\\metre", text: "incisal opening design value (P95)"}
reqProtrusion: {source: "requirements:requirements", filter: {key: protrusion_mm}, column: value, n: n, fmt: "req", unit: "\\milli\\metre", text: "protrusion design value (P95)"}
reqLaterotrusion: {source: "requirements:requirements", filter: {key: laterotrusion_mm}, column: value, n: n, fmt: "req", unit: "\\milli\\metre", text: "laterotrusion design value (P95, larger side)"}
reqOpeningAngle: {source: "requirements:requirements", filter: {key: opening_angle_deg}, column: value, n: n, fmt: "req", unit: "\\degree", text: "opening rotation design value (P95)"}
reqTranslation: {source: "requirements:requirements", filter: {key: translation_mm}, column: value, n: n, fmt: "req", unit: "\\milli\\metre", text: "passive translation design value (P95 of the condyle-point excursion)"}
reqTranslationMedian: {source: "requirements:requirements", filter: {key: translation_mm}, column: median, fmt: ".1f", unit: "\\milli\\metre", text: "median condyle-point excursion"}
reqPeakVelocity: {source: "requirements:requirements", filter: {key: peak_vel_dps}, column: value, n: n, fmt: "req", unit: "\\degree\\per\\second", text: "peak opening angular velocity (P95)"}
reqHingeFit: {source: "requirements:requirements", filter: {key: misalign_hinge_fit_mm}, column: value, ci: [ci_lo, ci_hi], n: n, fmt: "req", unit: "\\milli\\metre", text: "best-fit fixed-hinge misalignment (median)"}
reqHingeTmj: {source: "requirements:requirements", filter: {key: misalign_hinge_tmj_mm}, column: value, ci: [ci_lo, ci_hi], n: n, fmt: "req", unit: "\\milli\\metre", text: "hinge through palpated condyles (median)"}
reqBandwidth: {source: "requirements:requirements", filter: {key: bandwidth_hz}, column: value, n: n, fmt: "req", unit: "\\hertz", text: "control bandwidth (P95)"}
reqLeadFirst: {source: "requirements:requirements", filter: {key: lead_first_ms}, column: value, ci: [ci_lo, ci_hi], n: n, fmt: "req", unit: "\\milli\\second", text: "EMG-to-motion lead, opening, first onset"}
reqLeadDrive: {source: "requirements:requirements", filter: {key: lead_drive_ms}, column: value, ci: [ci_lo, ci_hi], n: n, fmt: "req", unit: "\\milli\\second", text: "EMG-to-motion lead, opening, driving burst"}
reqCloserRelease: {source: "requirements:requirements", filter: {key: closer_release_ms}, column: value, ci: [ci_lo, ci_hi], n: n, fmt: "req", unit: "\\milli\\second", text: "closer release before opening (exploratory)"}
reqCausalRelease: {source: "requirements:requirements", filter: {key: causal_release_ms}, column: value, ci: [ci_lo, ci_hi], n: n, fmt: "req", unit: "\\milli\\second", text: "causal closer-release anticipation (exploratory)"}
reqImuRmse: {source: "requirements:requirements", filter: {key: imu_angle_rmse_deg}, column: value, ci: [ci_lo, ci_hi], n: n, fmt: "req", unit: "\\degree", text: "IMU opening-angle RMSE (median)"}
reqImuLoaOwn: {source: "requirements:requirements", filter: {key: imu_opening_loa_subject_mm}, column: value, n: n, fmt: "req", unit: "\\milli\\metre", text: "IMU incisal opening, own model, largest |LoA|"}
reqImuLoaOwnUpper: {source: "requirements:requirements", filter: {key: imu_opening_loa_subject_mm}, column: ci_hi, fmt: "req", unit: "\\milli\\metre", text: "upper CI of the own-model |LoA|"}
reqImuLoaGeneric: {source: "requirements:requirements", filter: {key: imu_opening_loa_loso_mm}, column: value, n: n, fmt: "req", unit: "\\milli\\metre", text: "IMU incisal opening, generic model, largest |LoA|"}
reqImuLoaGenericUpper: {source: "requirements:requirements", filter: {key: imu_opening_loa_loso_mm}, column: ci_hi, fmt: "req", unit: "\\milli\\metre", text: "upper CI of the generic-model |LoA|"}
imuOpeningCycles: {source: "stats_imu:imu_opening_cycles", filter: {task: open_close}, column: cycle, agg: count, n: {distinct: pid}, fmt: ".0f", unit: "", n_of: participants, text: "C3a: open-close cycles in the Bland-Altman agreement of the IMU incisal opening (the imu figure)"}

# E31: a P95 design value at n = 13 has no finite two-sided 95 % interval; the text says
# "P95 (lower 95 % bound; maximum)": the exact one-sided lower bound X(k) and the sample
# maximum (it covers >= 80 % of the population with the confidence reqMaxConf).
reqOpeningLower: {source: "requirements:requirements", filter: {key: opening_mm}, column: ci_lo, n: n, fmt: "req", unit: "\\milli\\metre", text: "incisal opening: one-sided lower 95 % bound of the P95, order statistic X(k) (E31)"}
reqOpeningMax: {source: "requirements:requirements", filter: {key: opening_mm}, column: sample_max, n: n, fmt: "req", unit: "\\milli\\metre", text: "incisal opening: largest participant value (E31)"}
reqProtrusionLower: {source: "requirements:requirements", filter: {key: protrusion_mm}, column: ci_lo, n: n, fmt: "req", unit: "\\milli\\metre", text: "protrusion: one-sided lower 95 % bound of the P95, order statistic X(k) (E31)"}
reqProtrusionMax: {source: "requirements:requirements", filter: {key: protrusion_mm}, column: sample_max, n: n, fmt: "req", unit: "\\milli\\metre", text: "protrusion: largest participant value (E31)"}
reqLaterotrusionLower: {source: "requirements:requirements", filter: {key: laterotrusion_mm}, column: ci_lo, n: n, fmt: "req", unit: "\\milli\\metre", text: "laterotrusion (larger side): one-sided lower 95 % bound of the P95, order statistic X(k) (E31)"}
reqLaterotrusionMax: {source: "requirements:requirements", filter: {key: laterotrusion_mm}, column: sample_max, n: n, fmt: "req", unit: "\\milli\\metre", text: "laterotrusion (larger side): largest participant value (E31)"}
reqOpeningAngleLower: {source: "requirements:requirements", filter: {key: opening_angle_deg}, column: ci_lo, n: n, fmt: "req", unit: "\\degree", text: "opening rotation: one-sided lower 95 % bound of the P95, order statistic X(k) (E31)"}
reqOpeningAngleMax: {source: "requirements:requirements", filter: {key: opening_angle_deg}, column: sample_max, n: n, fmt: "req", unit: "\\degree", text: "opening rotation: largest participant value (E31)"}
reqTranslationLower: {source: "requirements:requirements", filter: {key: translation_mm}, column: ci_lo, n: n, fmt: "req", unit: "\\milli\\metre", text: "passive translation (condyle-point excursion): one-sided lower 95 % bound of the P95, order statistic X(k) (E31)"}
reqTranslationMax: {source: "requirements:requirements", filter: {key: translation_mm}, column: sample_max, n: n, fmt: "req", unit: "\\milli\\metre", text: "passive translation (condyle-point excursion): largest participant value (E31)"}
reqPeakVelocityLower: {source: "requirements:requirements", filter: {key: peak_vel_dps}, column: ci_lo, n: n, fmt: "req", unit: "\\degree\\per\\second", text: "peak opening angular velocity: one-sided lower 95 % bound of the P95, order statistic X(k) (E31)"}
reqPeakVelocityMax: {source: "requirements:requirements", filter: {key: peak_vel_dps}, column: sample_max, n: n, fmt: "req", unit: "\\degree\\per\\second", text: "peak opening angular velocity: largest participant value (E31)"}
reqBandwidthLower: {source: "requirements:requirements", filter: {key: bandwidth_hz}, column: ci_lo, n: n, fmt: "req", unit: "\\hertz", text: "control bandwidth: one-sided lower 95 % bound of the P95, order statistic X(k) (E31)"}
reqBandwidthMax: {source: "requirements:requirements", filter: {key: bandwidth_hz}, column: sample_max, n: n, fmt: "req", unit: "\\hertz", text: "control bandwidth: largest participant value (E31)"}
reqLowerOrder: {source: "requirements:requirements", filter: {key: opening_mm}, column: lower_k, n: n, fmt: "d", unit: "", text: "k of the one-sided lower bound X(k) of a P95 (workspace rows; n participants)"}
reqBandwidthLowerOrder: {source: "requirements:requirements", filter: {key: bandwidth_hz}, column: lower_k, n: n, fmt: "d", unit: "", text: "k of the lower bound X(k) of the bandwidth P95 (fewer participants with both IMUs)"}
reqMaxQuantile: {source: "requirements:requirements", filter: {key: opening_mm}, column: max_q, fmt: ".2f", unit: "", text: "population quantile the sample maximum exceeds (0.80)"}
reqMaxConf: {source: "requirements:requirements", filter: {key: opening_mm}, column: max_conf, fmt: ".3f", unit: "", text: "confidence that the sample maximum exceeds that quantile (1 - 0.8^n)"}
reqUpperMinN: {source: "derived:p95_upper_bound", column: n_min_upper, fmt: "d", unit: "", text: "smallest n with a one-sided upper 95 % bound of a P95 (n >= ln 0.05 / ln 0.95; E31)"}
reqMaxAboveConf: {source: "derived:p95_upper_bound", column: max_above_p95_conf, fmt: ".2f", unit: "", text: "probability that the sample maximum of the workspace n lies above the P95 (1 - 0.95^n; E31)"}

# -- C1: not a hinge --------------------------------------------------------------------------
hingeAboveInvivo: {source: "stats_kinematics:hinge_noise_summary", column: above_invivo_n, fmt: "d", unit: "", text: "participants whose hinge residual exceeds the in-vivo noise P99"}
hingeAboveBench: {source: "stats_kinematics:hinge_noise_summary", column: above_bench_n, fmt: "d", unit: "", text: "participants above the bench noise P99"}
hingeTested: {source: "stats_kinematics:hinge_noise_summary", column: n_tested_invivo, fmt: "d", unit: "", text: "participants tested against the in-vivo noise"}
hingeRatio: {source: "stats_kinematics:hinge_noise_summary", column: ratio_invivo_median, ci: [ratio_invivo_ci_lo, ratio_invivo_ci_hi], fmt: ".2f", unit: "", text: "median ratio of hinge residual to in-vivo noise"}
condylesPlausible: {source: "stats_kinematics:subjects", column: condyles_plausible, agg: sum, fmt: ".0f", unit: "", text: "participants with plausible condyle landmarks"}

# -- C1 led by the hinge through the condyle points (D33, post hoc) and its robustness (D24) --
# stats_kinematics:hinge_noise_tests: participants whose observed residual exceeds the noise
# P99 of a perfect hinge (above_n of n_tested), the median observed / noise ratio (BCa CI) and
# the cohort Wilcoxon test of the log ratio. Qualisys check: VD21, cited from the systems paper.
tmjInvivoAbove: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_tmj, group: all}, column: above_n, n: n_tested, fmt: "d", unit: "", text: "participants above the P99 of the in-vivo noise of the hinge through the condyle points (D33)"}
tmjInvivoTested: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_tmj, group: all}, column: n_tested, fmt: "d", unit: "", text: "participants tested against the in-vivo noise of the hinge through the condyle points (D33)"}
tmjInvivoRatio: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_tmj, group: all}, column: noise_ratio_median, ci: [noise_ratio_ci_lo, noise_ratio_ci_hi], n: n_tested, fmt: ".2f", unit: "", text: "median ratio of the observed residual to the P99 of the in-vivo noise of the hinge through the condyle points (D33)"}
tmjInvivoP: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_tmj, group: all}, column: wilcoxon_log_ratio_p, fmt: ".4f", unit: "", text: "Wilcoxon p of the log ratio, in-vivo noise of the hinge through the condyle points (D33)"}
tmjBenchAbove: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: bench_tmj, group: all}, column: above_n, n: n_tested, fmt: "d", unit: "", text: "participants above the P99 of the bench noise of the hinge through the condyle points (D33)"}
tmjBenchTested: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: bench_tmj, group: all}, column: n_tested, fmt: "d", unit: "", text: "participants tested against the bench noise of the hinge through the condyle points (D33)"}
tmjBenchRatio: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: bench_tmj, group: all}, column: noise_ratio_median, ci: [noise_ratio_ci_lo, noise_ratio_ci_hi], n: n_tested, fmt: ".2f", unit: "", text: "median ratio of the observed residual to the P99 of the bench noise of the hinge through the condyle points (D33)"}
tmjBenchP: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: bench_tmj, group: all}, column: wilcoxon_log_ratio_p, fmt: ".4f", unit: "", text: "Wilcoxon p of the log ratio, bench noise of the hinge through the condyle points (D33)"}
tmjInvivoPlausibleAbove: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_tmj, group: plausible_condyles}, column: above_n, n: n_tested, fmt: "d", unit: "", text: "participants above the P99 of the in-vivo noise of the condyle hinge, plausible condyle points (D33)"}
tmjInvivoPlausibleTested: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_tmj, group: plausible_condyles}, column: n_tested, fmt: "d", unit: "", text: "participants tested against the in-vivo noise of the condyle hinge, plausible condyle points (D33)"}
tmjInvivoPlausibleRatio: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_tmj, group: plausible_condyles}, column: noise_ratio_median, ci: [noise_ratio_ci_lo, noise_ratio_ci_hi], n: n_tested, fmt: ".2f", unit: "", text: "median ratio of the observed residual to the P99 of the in-vivo noise of the condyle hinge, plausible condyle points (D33)"}
tmjInvivoPlausibleP: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_tmj, group: plausible_condyles}, column: wilcoxon_log_ratio_p, fmt: ".4f", unit: "", text: "Wilcoxon p of the log ratio, in-vivo noise of the condyle hinge, plausible condyle points (D33)"}
hingeInvivoP: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo, group: all}, column: wilcoxon_log_ratio_p, fmt: ".3f", unit: "", text: "Wilcoxon p of the log ratio, best-fit hinge vs in-vivo noise (pre-specified C1)"}
# D24 robustness of the pre-specified C1 (best-fit hinge): resampled rest-pose fluctuation
# (slow), times the tracking-error ratio (motion), teeth-marker noise (teeth).
hingeSlowAbove: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_slow, group: all}, column: above_n, n: n_tested, fmt: "d", unit: "", text: "participants above the P99 of the slow in-vivo noise (D24)"}
hingeSlowTested: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_slow, group: all}, column: n_tested, fmt: "d", unit: "", text: "participants tested against the slow in-vivo noise (D24)"}
hingeSlowRatio: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_slow, group: all}, column: noise_ratio_median, ci: [noise_ratio_ci_lo, noise_ratio_ci_hi], n: n_tested, fmt: ".2f", unit: "", text: "median ratio of the observed residual to the P99 of the slow in-vivo noise (D24)"}
hingeSlowP: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_slow, group: all}, column: wilcoxon_log_ratio_p, fmt: ".2f", unit: "", text: "Wilcoxon p of the log ratio, slow in-vivo noise (D24)"}
hingeMotionAbove: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_motion, group: all}, column: above_n, n: n_tested, fmt: "d", unit: "", text: "participants above the P99 of the motion-scaled in-vivo noise (D24)"}
hingeMotionTested: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_motion, group: all}, column: n_tested, fmt: "d", unit: "", text: "participants tested against the motion-scaled in-vivo noise (D24)"}
hingeMotionRatio: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_motion, group: all}, column: noise_ratio_median, ci: [noise_ratio_ci_lo, noise_ratio_ci_hi], n: n_tested, fmt: ".2f", unit: "", text: "median ratio of the observed residual to the P99 of the motion-scaled in-vivo noise (D24)"}
hingeMotionP: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_motion, group: all}, column: wilcoxon_log_ratio_p, fmt: ".2f", unit: "", text: "Wilcoxon p of the log ratio, motion-scaled in-vivo noise (D24)"}
hingeTeethAbove: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_teeth, group: all}, column: above_n, n: n_tested, fmt: "d", unit: "", text: "participants above the P99 of the teeth-marker in-vivo noise (D24)"}
hingeTeethTested: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_teeth, group: all}, column: n_tested, fmt: "d", unit: "", text: "participants tested against the teeth-marker in-vivo noise (D24)"}
hingeTeethRatio: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_teeth, group: all}, column: noise_ratio_median, ci: [noise_ratio_ci_lo, noise_ratio_ci_hi], n: n_tested, fmt: ".2f", unit: "", text: "median ratio of the observed residual to the P99 of the teeth-marker in-vivo noise (D24)"}
hingeTeethP: {source: "stats_kinematics:hinge_noise_tests", filter: {noise: invivo_teeth, group: all}, column: wilcoxon_log_ratio_p, fmt: ".4f", unit: "", text: "Wilcoxon p of the log ratio, teeth-marker in-vivo noise (D24)"}

# -- C2: EMG-to-motion lead (both onset rules; not confirmed) --------------------------------
leadOpenFirst: {source: "stats_timing:timing_cohort", filter: {task: open_close, direction: opening, detector: tkeo, rule: first, metric: lead_ms}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".0f", unit: "\\milli\\second", text: "open-close opening lead, first onset"}
leadOpenFirstPHolm: {source: "stats_timing:timing_cohort", filter: {task: open_close, direction: opening, detector: tkeo, rule: first, metric: lead_ms}, column: p_holm, fmt: ".3f", unit: "", text: "Holm p, open-close opening lead, first onset"}
leadOpenFirstExcluded: {source: "stats_timing:timing_cohort", filter: {task: open_close, direction: opening, detector: tkeo, rule: first, metric: lead_ms}, column: n_excluded_min_cycles, fmt: ".0f", unit: "", text: "participants excluded by the minimum of 3 usable opener channel-cycles (D15, E33.2)"}
leadOpenDrive: {source: "stats_timing:timing_cohort", filter: {task: open_close, direction: opening, detector: tkeo, rule: drive, metric: lead_ms}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".0f", unit: "\\milli\\second", text: "open-close opening lead, driving burst"}
leadOpenDrivePHolm: {source: "stats_timing:timing_cohort", filter: {task: open_close, direction: opening, detector: tkeo, rule: drive, metric: lead_ms}, column: p_holm, fmt: ".2f", unit: "", text: "Holm p, open-close opening lead, driving burst"}
leadOpenDriveExcluded: {source: "stats_timing:timing_cohort", filter: {task: open_close, direction: opening, detector: tkeo, rule: drive, metric: lead_ms}, column: n_excluded_min_cycles, fmt: ".0f", unit: "", text: "participants excluded by the minimum of 3 usable opener channel-cycles (D15, E33.2)"}
leadChewFirst: {source: "stats_timing:timing_cohort", filter: {task: chewing, direction: opening, detector: tkeo, rule: first, metric: lead_ms}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".0f", unit: "\\milli\\second", text: "chewing opening lead, first onset"}
leadChewFirstPHolm: {source: "stats_timing:timing_cohort", filter: {task: chewing, direction: opening, detector: tkeo, rule: first, metric: lead_ms}, column: p_holm, fmt: ".3f", unit: "", text: "Holm p, chewing opening lead, first onset"}
leadChewDrive: {source: "stats_timing:timing_cohort", filter: {task: chewing, direction: opening, detector: tkeo, rule: drive, metric: lead_ms}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".0f", unit: "\\milli\\second", text: "chewing opening lead, driving burst"}
leadChewDrivePHolm: {source: "stats_timing:timing_cohort", filter: {task: chewing, direction: opening, detector: tkeo, rule: drive, metric: lead_ms}, column: p_holm, fmt: ".3f", unit: "", text: "Holm p, chewing opening lead, driving burst"}

# D23 / D34: the chance null of the confirmatory leads is a window bias, not a test of the
# order: the median lead of circularly shifted EMG (an onset unrelated to the motion) and the
# observed minus that null (negative: observed onsets sit closer to the movement).
leadOpenFirstNull: {source: "stats_timing:timing_cohort", filter: {task: open_close, direction: opening, detector: tkeo, rule: first, metric: lead_ms}, column: lead_null_ms, n: n, fmt: ".0f", unit: "\\milli\\second", text: "window bias: median lead of shifted EMG, open-close, first onset"}
leadOpenFirstMinusNull: {source: "derived:c2_null_period", filter: {band: 0.0, task: open_close, direction: opening, detector: tkeo, rule: first}, column: mn_median, ci: [mn_ci_lo, mn_ci_hi], n: mn_n, fmt: ".0f", unit: "\\milli\\second", text: "observed lead minus the window bias, open-close, first onset (median over participants, 95 % BCa CI; J17)"}
leadOpenDriveNull: {source: "stats_timing:timing_cohort", filter: {task: open_close, direction: opening, detector: tkeo, rule: drive, metric: lead_ms}, column: lead_null_ms, n: n, fmt: ".0f", unit: "\\milli\\second", text: "window bias: median lead of shifted EMG, open-close, driving burst"}
leadOpenDriveMinusNull: {source: "derived:c2_null_period", filter: {band: 0.0, task: open_close, direction: opening, detector: tkeo, rule: drive}, column: mn_median, ci: [mn_ci_lo, mn_ci_hi], n: mn_n, fmt: ".0f", unit: "\\milli\\second", text: "observed lead minus the window bias, open-close, driving burst (median over participants, 95 % BCa CI; J17)"}
