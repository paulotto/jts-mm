cTwoECouplingChewing: {source: "stats_timing:c2e_cohort", filter: {key: p5_chewing}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".0f", unit: "\\milli\\second", text: "supporting: EMG-to-acceleration lag, chewing (P5, residualised), median"}
