# -- cited from the systems paper -----------------------------------
# Resolved from the validation study's snapshot pinned below with the systems paper's own declarations
# ("same"), written to numbers.tex as normal macros but listed under "cited" in numbers.json.
# Cite these, do not re-report them: one sentence plus a citation each (`biomech check-paper`
# lists a cited macro whose sentence has no \cite). n = 2 rule (EV8): per
# participant (POne, PTwo) and their mean; a cited number cannot be a mean_of, so the means
# are declared after this block over the cited pair (the systems paper's own ...Mean macros
# are the same values).
# -- J13: masses of the worn printed parts (hardware/mechanical/tables/parts.csv, print geometry; weigh before quoting, h11 §3)
hwMassTeethAttachment: {"source": "hw:parts", "column": "mass_printed_g", "filter": {"part_title": "Teeth attachment", "title": "Version 5, 5 mm (print 2026-10-03)"}, "fmt": ".0f", "unit": "\\gram", "text": "teeth attachment V5 (printed 2026-10-03), mass from print geometry"}
hwMassMouthMarker: {"source": "hw:parts", "column": "mass_printed_g", "filter": {"part_title": "Mouth marker", "title": "ArUco + IMU (CAD state 2026-10-09)"}, "fmt": ".0f", "unit": "\\gram", "text": "mouth marker of the dataset (ArUco, current model; user 2026-11-04), printed-mass estimate from print geometry at about 10 % infill"}

cite:
  systems:
    study: ../jtsmm_validation/study.yaml
    snapshot: v15
    label: systems paper
    from: ../jtsmm_validation/numbers_systems.yaml
    numbers:
      peakRatioOpenPOne: same          # A2: what 40 Hz optics miss of peak opening velocity
      peakRatioOpenPTwo: same
      bandAboveTwentyMaxPOne: same     # A2: share of opening-rate power above 20 Hz at 200 Hz, movement tasks;
      bandAboveTwentyMaxPTwo: same     #     an upper bound incl. marker noise (EV7 addendum: the unfiltered f95 is
                                       #     noise-inflated and is not cited)
      alignedIncisorPOne: same         # A3: optical accuracy behind the hinge residual
      alignedIncisorPTwo: same
      alignedRotationPOne: same        # 2026-11-11 (JNER shortening round): instrument accuracy in the Methods
      alignedRotationPTwo: same        #   (frame-aligned jaw rotation vs Qualisys, movement tasks pooled)
      ownIncisorPOne: same             #   the same comparison in each system's own anatomical frames (gated),
      ownIncisorPTwo: same             #   reported next to the aligned values so they do not read as selective
      ownRotationPOne: same
      ownRotationPTwo: same
      ladderJtsmmFrontalNear: same     #   bench trueness on the printed ladder: mean 20-mm step error with 95 % CI
      ladderJtsmmFrontalFar: same
      ladderJtsmmLateralNear: same
      ladderJtsmmLateralFar: same
      ladderJtsmmStepMin: same         #   the range of the four (signed), so the Methods do not depend on which condition is extreme
      ladderJtsmmStepMax: same
      jitterErrOpticalPOne: same       # A3: raw 40 Hz error jitter vs the dataset low-pass
      jitterErrOpticalPTwo: same
      jitterErrLowpassPOne: same
      jitterErrLowpassPTwo: same
      smoothOpticalPOne: same          # A3: trajectory smoothness above 6 Hz, raw optics and 6-Hz low-pass
      smoothOpticalPTwo: same
      smoothLowpassPOne: same
      smoothLowpassPTwo: same
      openImuQualisysBiasPOne: same    # A6: IMU alone vs Qualisys
      openImuQualisysBiasPTwo: same
      openImuQualisysSdPOne: same
      openImuQualisysSdPTwo: same
      openOpticalQualisysRmsePOne: same
      openOpticalQualisysRmsePTwo: same
      hingeFitQualisysOpenPOne: same   # VD21: the hinge models on Qualisys (C1 check)
      hingeFitQualisysOpenPTwo: same
      hingeTmjQualisysOpenPOne: same
      hingeTmjQualisysOpenPTwo: same
      hingeAxisQualisysOpenPOne: same
      hingeAxisQualisysOpenPTwo: same
      cfOpenRmseAnchoredPOne: same     # VD20: camera-free opening (E3b) and translation (E4own) vs Qualisys
      cfOpenRmseAnchoredPTwo: same
      cfIncRmseOwnPOne: same
      cfIncRmseOwnPTwo: same
      hingeFitJtsmmOpenPOne: same      # J8: VD21, best-fit hinge on JTS-MM (the tracking share of the residual)
      hingeFitJtsmmOpenPTwo: same
      hingeFitDiffOpenPOne: same       #     JTS-MM minus Qualisys, best-fit hinge, open-close
      hingeFitDiffOpenPTwo: same
      hingeFitQualisysChewPOne: same   #     best-fit hinge on Qualisys, chewing (P1 only)
      bandFFiftyMaxPOne: same          # J8: f50 of the 200-Hz opening rate (largest over the movement tasks)
      bandFFiftyMaxPTwo: same
      bandFNinetyFiveFiltMinPOne: same #     f95 of the filtered spectrum, range over the movement tasks
      bandFNinetyFiveFiltMaxPOne: same
      bandFNinetyFiveFiltMinPTwo: same
      bandFNinetyFiveFiltMaxPTwo: same
      mountIntakeHeadPOne: same        # J8: the fusion head mounting vs hand-eye (not identifiable)
      mountIntakeHeadPTwo: same

# Means of the cited pairs (n = 2 rule): descriptive, over the two participants above.
peakRatioOpenMean: {mean_of: [peakRatioOpenPOne, peakRatioOpenPTwo], text: "peak opening velocity ratio, 40 Hz optics over the 200 Hz reference, mean of the two systems-paper participants"}
jitterErrOpticalMean: {mean_of: [jitterErrOpticalPOne, jitterErrOpticalPTwo], text: "incisor error jitter above 6 Hz, raw 40 Hz optics, mean of the two systems-paper participants"}
jitterErrLowpassMean: {mean_of: [jitterErrLowpassPOne, jitterErrLowpassPTwo], text: "incisor error jitter above 6 Hz, dataset low-pass, mean of the two systems-paper participants"}
smoothOpticalMean: {mean_of: [smoothOpticalPOne, smoothOpticalPTwo], text: "incisor trajectory content above 6 Hz (smoothness), raw 40 Hz optics, mean of the two systems-paper participants"}
smoothLowpassMean: {mean_of: [smoothLowpassPOne, smoothLowpassPTwo], text: "incisor trajectory content above 6 Hz (smoothness), after a 6-Hz low-pass, mean of the two systems-paper participants"}
hingeTmjQualisysOpenMean: {mean_of: [hingeTmjQualisysOpenPOne, hingeTmjQualisysOpenPTwo], text: "residual of the hinge through the condyle points on Qualisys, open-close, mean of the two participants"}
hingeFitQualisysOpenMean: {mean_of: [hingeFitQualisysOpenPOne, hingeFitQualisysOpenPTwo], text: "residual of the best-fit hinge on Qualisys, open-close, mean of the two participants"}
cfOpenRmseAnchoredMean: {mean_of: [cfOpenRmseAnchoredPOne, cfOpenRmseAnchoredPTwo], text: "camera-free opening-angle RMSE vs Qualisys (E3b), mean of the two participants"}

# -- J8: numbers the docs state, now macros ---------------
# Method parameters as the store was computed with them (config:, the snapshot's frozen study
# configuration) and stored results the docs quoted by hand.
poseLowpass: {source: "config:signals.kinematics.lowpass_hz", fmt: ".0f", unit: "\\hertz", text: "pose low-pass cut-off of the dataset chain (D20 primary)"}
condyleDepthMin: {source: "config:signals.kinematics.min_condyle_posterior_mm", fmt: ".0f", unit: "\\milli\\metre", text: "D18 plausibility: side-mean depth of the condyle points behind the incisor, at least"}
hingeMotionScale: {source: "config:stages.uncertainty.motion_noise_scale", fmt: ".2f", unit: "", text: "D24 motion null: factor of tracking error during movement over rest"}
mlInnerFolds: {source: "config:stages.ml_eval.inner_folds", fmt: ".0f", unit: "", text: "C3b: inner folds of the nested hyper-parameter search (per LOSO fold)"}
mlMaxTrain: {source: "config:stages.ml_eval.max_train", fmt: ".0f", unit: "", text: "C3b: training windows per fold at most (random subsample)"}
svmGridC: {source: "derived:svm_search", filter: {param: C}, column: grid_values, text: "C3b: SVM C values searched (RBF kernel, balanced class weights)"}
svmGridGamma: {source: "derived:svm_search", filter: {param: gamma_mult}, column: grid_values, text: "C3b: SVM kernel-width multiples of the training fold's scale value searched"}
timingEmgPre: {source: "config:stages.timing.emg_pre_s", scale: 1000, fmt: ".0f", unit: "\\milli\\second", text: "C2 EMG search window: start before the mechanical onset"}
timingEmgPost: {source: "config:stages.timing.emg_post_s", scale: 1000, fmt: ".0f", unit: "\\milli\\second", text: "C2 EMG search window: end after the mechanical onset"}
fewShotGuard: {source: "config:stages.ml_eval.variants.few_shot.guard_s", fmt: ".2f", unit: "\\second", text: "few-shot calibration: guard between the calibration windows and the scored windows"}
labelThrAngle: {source: "labels_check:kappa", filter: {variant: fixed, level: participant_phase}, column: thr_theta_dps, agg: max, fmt: ".0f", unit: "\\degree\\per\\second", text: "label check, second rule: opening-angle rate threshold (fixed before the comparison)"}
labelThrAxis: {source: "labels_check:kappa", filter: {variant: fixed, level: participant_phase}, column: thr_x_mm_s, agg: max, fmt: ".0f", unit: "\\milli\\metre\\per\\second", text: "label check, second rule: incisor axis velocity threshold (protrusion and laterotrusion axes)"}
labelThrSpeed: {source: "labels_check:kappa", filter: {variant: fixed, level: participant_phase}, column: thr_speed_mm_s, agg: max, fmt: ".0f", unit: "\\milli\\metre\\per\\second", text: "label check, second rule: free-motion 3-D incisor speed threshold"}
labelKappaAllFrames: {source: "labels_check:kappa", filter: {variant: fixed, scope: all_phases, level: overall_all_frames}, column: kappa, fmt: ".2f", unit: "", text: "pooled over frames (method diagnostic, J22.4): label kappa over all frames (not only the sampled windows), all phases"}
emgMaskCycles: {source: "emg:mask_sensitivity", column: n_cycles, agg: sum, fmt: "d", unit: "", n_of: participants, text: "D14: opener and closer channel-cycles of open-close and chewing (the cycle rule's denominator)"}
emgMaskKeptLowfreq: {source: "emg:mask_sensitivity", column: kept_alt, agg: sum, fmt: "d", unit: "", n_of: participants, text: "D14: channel-cycles the > 10 % masked rule would keep if the low-frequency rule excluded samples (pre-D14)"}
hingeTmjMin: {source: "stats_kinematics:hinge_summary", filter: {model: hinge_tmj, metric: rms_incisor_mm}, column: min, n: n, fmt: ".1f", unit: "\\milli\\metre", text: "hinge through the condyle points: smallest participant incisal residual"}
hingeTmjMax: {source: "stats_kinematics:hinge_summary", filter: {model: hinge_tmj, metric: rms_incisor_mm}, column: max, n: n, fmt: ".1f", unit: "\\milli\\metre", text: "hinge through the condyle points: largest participant incisal residual"}
hingeBenchNoise: {source: "uncertainty:hinge_noise", column: null_bench_p99_mm, agg: median, fmt: ".2f", unit: "\\milli\\metre", text: "per-participant P99 (q99,i) of the bench (tracking) noise null of the compromise-axis hinge residual, median over participants"}
hingeBenchNoiseMin: {source: "uncertainty:hinge_noise", column: null_bench_p99_mm, agg: min, fmt: ".2f", unit: "\\milli\\metre", text: "per-participant bench-noise P99 of the compromise-axis hinge residual, smallest participant"}
hingeBenchNoiseMax: {source: "uncertainty:hinge_noise", column: null_bench_p99_mm, agg: max, fmt: ".2f", unit: "\\milli\\metre", text: "the same, largest participant"}
hingeInvivoNoiseMin: {source: "uncertainty:hinge_noise", column: null_invivo_p99_mm, agg: min, fmt: ".1f", unit: "\\milli\\metre", text: "per-participant P99 (q99,i) of the in-vivo (rest-pose) noise null of the compromise-axis hinge residual, smallest participant"}
hingeInvivoNoiseMax: {source: "uncertainty:hinge_noise", column: null_invivo_p99_mm, agg: max, fmt: ".1f", unit: "\\milli\\metre", text: "per-participant P99 (q99,i) of the in-vivo (rest-pose) noise null of the compromise-axis hinge residual, largest participant"}
geoArchLowerMin: {"source": "stats_kinematics:reference_values", "filter": {"metric": "lower_arch_depth_mm", "group": "all"}, "column": "min", "fmt": ".0f", "unit": "\\milli\\metre", "text": "lower arch depth, smallest participant (misplaced tooth landmarks; flagged, not excluded)"}
geoArchUpperMin: {"source": "stats_kinematics:reference_values", "filter": {"metric": "upper_arch_depth_mm", "group": "all"}, "column": "min", "fmt": ".0f", "unit": "\\milli\\metre", "text": "upper arch depth, smallest participant (misplaced tooth landmarks; flagged, not excluded)"}
impDropNegative: {"source": "qc_cohort:impedance", "filter": {"take": "second_minus_first", "muscle": "all"}, "column": "n_negative", "fmt": "d", "unit": "", "text": "participants whose median impedance fell from the first to the second take"}
cTwoEHTwoPLock: {source: "stats_timing:c2e_cohort", filter: {key: h2}, column: p_lock, fmt: ".4f", unit: "", text: "H2 locking p (closer release time-locked to the opening onset, open-close)"}
xTwoDigastricRise: {source: "stats_timing:ensemble_cohort", filter: {task: open_close, direction: opening, role: agonist, event: rise}, column: median, scale: -1, n: n, fmt: ".0f", unit: "\\milli\\second", text: "X2: digastric group-envelope rise after the mechanical opening onset t_mech (median; stored as a negative lead)"}
cfConTransESixEFourOwnPUnadj: {source: "camerafree_cohort:cf_contrasts", filter: {family: translation, contrast: "E6-E4own"}, column: p, fmt: ".3f", unit: "", text: "unadjusted p of the translation contrast E6-E4own (E40)"}

# -- R8: resolve from r14a --
# New results of the R8 re-run (J9); they do not exist in r13a, so this block fails there.
# Written from the producing code: X7 envelope rows (stats/requirements.py _envelope_rows and
# the posterior_excursion_mm row; per participant stats/cohort_kinematics.py dynamics_envelope,
# posterior_excursion), X8 (requirements:max_coverage, coverage_table), X9
# (stats_kinematics:coupling_summary, coupling_summary: one row per participant), the dataset
# dynamic-calibration audit (imu_dyncal_cohort:dyncal_transition_test, transition_test) and the
# sensitivities onset_ksd_5 and s02_day2 (both on the reporting_population base; comparison columns
# primary = the 13-adult paper analysis, variant = the sensitivity).
reqCloseVel: {source: "requirements:requirements", filter: {key: close_vel_dps}, column: value, n: n, fmt: "req", unit: "\\degree\\per\\second", text: "X7: peak closing angular velocity design value (P95; lower bound of the 40-Hz / 6-Hz chain; post hoc)"}
reqCloseVelLower: {source: "requirements:requirements", filter: {key: close_vel_dps}, column: ci_lo, n: n, fmt: "req", unit: "\\degree\\per\\second", text: "X7: peak closing angular velocity, one-sided lower 95 % bound of the P95 (E31)"}
reqCloseVelMax: {source: "requirements:requirements", filter: {key: close_vel_dps}, column: sample_max, n: n, fmt: "req", unit: "\\degree\\per\\second", text: "X7: peak closing angular velocity, largest participant value (E31)"}
reqFreeOpenVel: {source: "requirements:requirements", filter: {key: free_peak_open_vel_dps}, column: value, n: n, fmt: "req", unit: "\\degree\\per\\second", text: "X7: peak opening angular velocity in free motion, design value (P95; post hoc)"}
reqFreeOpenVelLower: {source: "requirements:requirements", filter: {key: free_peak_open_vel_dps}, column: ci_lo, n: n, fmt: "req", unit: "\\degree\\per\\second", text: "X7: free-motion peak opening angular velocity, one-sided lower 95 % bound of the P95 (E31)"}
reqFreeOpenVelMax: {source: "requirements:requirements", filter: {key: free_peak_open_vel_dps}, column: sample_max, n: n, fmt: "req", unit: "\\degree\\per\\second", text: "X7: free-motion peak opening angular velocity, largest participant value (E31)"}
reqPeakAcc: {source: "requirements:requirements", filter: {key: peak_acc_dps2}, column: value, n: n, fmt: "req", unit: "\\degree\\per\\second\\squared", text: "X7: peak angular acceleration design value (P95 of the per-participant largest |acceleration|; post hoc)"}
reqPeakAccLower: {source: "requirements:requirements", filter: {key: peak_acc_dps2}, column: ci_lo, n: n, fmt: "req", unit: "\\degree\\per\\second\\squared", text: "X7: peak angular acceleration, one-sided lower 95 % bound of the P95 (E31)"}
reqPeakAccMax: {source: "requirements:requirements", filter: {key: peak_acc_dps2}, column: sample_max, n: n, fmt: "req", unit: "\\degree\\per\\second\\squared", text: "X7: peak angular acceleration, largest participant value (E31)"}
reqPeakAccPNinetyNine: {source: "stats_kinematics:subjects", column: peak_acc_p99_dps2, agg: median, fmt: ".0f", unit: "\\degree\\per\\second\\squared", text: "X7 robustness column: per-participant 99th percentile of |angular acceleration| (median over participants)"}
reqPosteriorExcursion: {source: "requirements:requirements", filter: {key: posterior_excursion_mm}, column: value, n: n, fmt: "req", unit: "\\milli\\metre", text: "X7: posterior incisal excursion behind rest, design value (P95 of the per-participant P99; post hoc)"}
reqPosteriorExcursionLower: {source: "requirements:requirements", filter: {key: posterior_excursion_mm}, column: ci_lo, n: n, fmt: "req", unit: "\\milli\\metre", text: "X7: posterior incisal excursion, one-sided lower 95 % bound of the P95 (E31)"}
reqPosteriorExcursionMax: {source: "requirements:requirements", filter: {key: posterior_excursion_mm}, column: sample_max, n: n, fmt: "req", unit: "\\milli\\metre", text: "X7: posterior incisal excursion, largest participant value (E31)"}
covSmallestNEighty: {source: "requirements:max_coverage", filter: {q: 0.8, smallest_n: true}, column: n, fmt: "d", unit: "", text: "X8: smallest n whose sample maximum exceeds the population P80 with 95 % confidence (planning only)"}
covSmallestNNinety: {source: "requirements:max_coverage", filter: {q: 0.9, smallest_n: true}, column: n, fmt: "d", unit: "", text: "X8: smallest n whose sample maximum exceeds the population P90 with 95 % confidence (planning only)"}
covNinetyAtThirteen: {source: "requirements:max_coverage", filter: {q: 0.9, n: 13, smallest_n: false}, column: p_max_exceeds, fmt: ".3f", unit: "", text: "X8: confidence that the maximum of 13 exceeds the population P90 (1 - 0.9^13)"}
couplingSlope: {source: "stats_kinematics:coupling_summary", column: slope_mm_per_deg, agg: median, fmt: ".2f", unit: "\\milli\\metre\\per\\degree", text: "X9: anterior condyle-midpoint translation per degree of opening (Theil-Sen slope, median over participants)"}
couplingSlopePlausible: {source: "stats_kinematics:coupling_summary", filter: {condyles_plausible: true}, column: slope_mm_per_deg, agg: median, fmt: ".2f", unit: "\\milli\\metre\\per\\degree", text: "X9: coupling slope, plausible condyles only (median)"}
couplingSlopeMin: {source: "stats_kinematics:coupling_summary", column: slope_mm_per_deg, agg: min, fmt: ".2f", unit: "\\milli\\metre\\per\\degree", text: "X9: smallest participant coupling slope (negative: palpation caveat)"}
couplingGenericRms: {source: "stats_kinematics:coupling_summary", column: generic_rms_mm, agg: median, fmt: ".1f", unit: "\\milli\\metre", text: "X9: RMS miss of the leave-one-out cohort coupling curve (generic model), median over participants"}
# derived from the store with the figures' helpers (viz/derived.py, 2026-11-05): hinge (b) and requirements (a, b)
couplingTransTen: {source: "derived:coupling_curve", filter: {angle_deg: 10.0}, column: cond_trans_mm, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "Anterior condyle-midpoint translation at 10 deg opening, median over participants with its 95 % percentile-bootstrap CI (the band of the hinge figure (b); skin-palpated condyle points)"}
wsOutsideMedian: {source: "derived:workspace_box", column: ws_outside_pct, agg: median, n: {distinct: pid}, fmt: ".0f", unit: "\\percent", text: "Share of a participant's incisal positions (all tasks) outside the P95 design box, median over participants"}
wsOutsideMax: {source: "derived:workspace_box", column: ws_outside_pct, agg: max, n: {distinct: pid}, fmt: ".0f", unit: "\\percent", text: "Share of a participant's incisal positions outside the P95 design box, largest participant"}
wsBehindMedian: {source: "derived:workspace_box", column: ws_behind_pct, agg: median, n: {distinct: pid}, fmt: ".0f", unit: "\\percent", text: "Share of a participant's incisal positions outside the P95 design box only because behind it, median over participants"}
condPathForward: {source: "derived:condyle_path", filter: {condyles_plausible: true}, column: cond_path_dx_mm, agg: median, n: {distinct: pid}, fmt: ".1f", unit: "\\milli\\metre", text: "Open-close displacement of the condyle-point midpoint, forward component, median (plausible condyles; closed to the widest openings, maxillary frame)"}
condPathDown: {source: "derived:condyle_path", filter: {condyles_plausible: true}, column: cond_path_dz_mm, agg: median, scale: -1, n: {distinct: pid}, fmt: ".1f", unit: "\\milli\\metre", text: "Open-close displacement of the condyle-point midpoint, downward component, median (plausible condyles)"}
condPathIncl: {source: "derived:condyle_path", filter: {condyles_plausible: true}, column: cond_path_incl_deg, agg: median, n: {distinct: pid}, fmt: ".0f", unit: "\\degree", text: "Inclination of the condyle-point path below the horizontal, median (plausible condyles)"}
axisDirMeasured: {source: "derived:condyle_path", filter: {condyles_plausible: true}, column: axis_dir_deg, agg: median, n: {distinct: pid}, fmt: ".0f", unit: "\\degree", text: "Direction of the best-fit axis from the condyle points, below the horizontal behind them, median (plausible condyles)"}
axisDirPredicted: {source: "derived:condyle_path", filter: {condyles_plausible: true}, column: axis_dir_pred_deg, agg: median, n: {distinct: pid}, fmt: ".0f", unit: "\\degree", text: "Axis direction predicted by rotation plus translation along the condyle-point path (90 deg minus its inclination), median (plausible condyles)"}
dyncalJumpStill: {source: "imu_dyncal_cohort:dyncal_transition_test", column: jump_still_median_deg, n: n_participants, fmt: ".2f", unit: "\\degree", text: "pooled over transitions (description): IMU dynamic calibration: median |residual jump| at phase transitions after stillness"}
dyncalJumpOther: {source: "imu_dyncal_cohort:dyncal_transition_test", column: jump_other_median_deg, n: n_participants, fmt: ".2f", unit: "\\degree", text: "pooled over transitions (description): IMU dynamic calibration: median |residual jump| at the other phase transitions"}
dyncalJumpP: {source: "imu_dyncal_cohort:dyncal_transition_test", column: p_mannwhitney, fmt: ".2f", unit: "", text: "pooled over transitions (description): IMU dynamic calibration: two-sided Mann-Whitney p, jumps after stillness vs the others (descriptive)"}
dyncalStillN: {source: "imu_dyncal_cohort:dyncal_transition_test", column: n_still, fmt: "d", unit: "", n_of: transitions, text: "IMU dynamic calibration: transitions after stillness"}
dyncalOtherN: {source: "imu_dyncal_cohort:dyncal_transition_test", column: n_other, fmt: "d", unit: "", n_of: transitions, text: "IMU dynamic calibration: other transitions"}
dyncalStillMin: {source: "imu_dyncal_cohort:dyncal_transition_test", column: still_min_s, fmt: ".0f", unit: "\\second", text: "IMU dynamic calibration: stillness before a transition, at least"}
dyncalPpN: {source: "derived:dyncal_participants", column: n, fmt: "d", unit: "", text: "J23: participants with transitions both after stillness and otherwise"}
dyncalPpRecorded: {source: "derived:dyncal_participants", column: n_recorded, fmt: "d", unit: "", text: "J23: participants with any phase transition in the check"}
dyncalPpStill: {source: "derived:dyncal_participants", column: still_median_deg, n: n, fmt: ".2f", unit: "\\degree", text: "J23: per participant the median |residual jump| after >= 2 s stillness, median over participants"}
dyncalPpOther: {source: "derived:dyncal_participants", column: other_median_deg, n: n, fmt: ".2f", unit: "\\degree", text: "J23: the same at the other transitions"}
dyncalPpHl: {source: "derived:dyncal_participants", column: hl_deg, ci: [hl_ci_lo, hl_ci_hi], n: n, fmt: ".2f", unit: "\\degree", text: "J23: paired difference after stillness minus other, Hodges-Lehmann estimate with exact 95 % CI"}
dyncalPpP: {source: "derived:dyncal_participants", column: p, fmt: ".2f", unit: "", text: "J23: two-sided Wilcoxon signed-rank p over participants (exact; descriptive)"}
ksdFiveLeadFirst: {source: "sensitivity:onset_ksd_5", filter: {stage: requirements, table: requirements, column: value, "@key": lead_first_ms}, column: variant, fmt: ".0f", unit: "\\milli\\second", text: "C2 lead, first onset, with the EMG onset threshold at rest mean + 5 SD (J3; primary 3 SD)"}
ksdFiveLeadDrive: {source: "sensitivity:onset_ksd_5", filter: {stage: requirements, table: requirements, column: value, "@key": lead_drive_ms}, column: variant, fmt: ".0f", unit: "\\milli\\second", text: "C2 lead, driving burst, with the EMG onset threshold at rest mean + 5 SD (J3; primary 3 SD)"}
ksdFiveLeadFirstPHolm: {source: "sensitivity:onset_ksd_5", filter: {stage: stats_timing, table: timing_cohort, column: p_holm, "@task": open_close, "@direction": opening, "@detector": tkeo, "@rule": first, "@metric": lead_ms}, column: variant, fmt: ".3f", unit: "", text: "Holm p, open-close opening lead, first onset, onset threshold 5 SD (J3)"}
ksdFiveLeadDrivePHolm: {source: "sensitivity:onset_ksd_5", filter: {stage: stats_timing, table: timing_cohort, column: p_holm, "@task": open_close, "@direction": opening, "@detector": tkeo, "@rule": drive, "@metric": lead_ms}, column: variant, fmt: ".3f", unit: "", text: "Holm p, open-close opening lead, driving burst, onset threshold 5 SD (J3)"}
ksdFiveCTwoEHOne: {source: "sensitivity:onset_ksd_5", filter: {stage: requirements, table: requirements, column: value, "@key": c2e_h1_ms}, column: variant, fmt: ".0f", unit: "\\milli\\second", text: "C2-E H1 locked lead (closers before closing), onset threshold 5 SD (J3)"}
# s02 day 1 vs day 2: the comparison key holds the per-day task labels of the subjects row
# (peak_acc_task), so s02 is one primary-only and one variant-only row; agg: max (NaN skipped)
# picks the one value of each side.
sTwoDayOneOpening: {source: "sensitivity:s02_day2", filter: {stage: stats_kinematics, table: subjects, column: opening_selfpaced_mm, "@pid": s02}, column: primary, agg: max, fmt: ".1f", unit: "\\milli\\metre", text: "S5.4 between-day: s02 self-paced opening, first session"}
sTwoDayTwoOpening: {source: "sensitivity:s02_day2", filter: {stage: stats_kinematics, table: subjects, column: opening_selfpaced_mm, "@pid": s02}, column: variant, agg: max, fmt: ".1f", unit: "\\milli\\metre", text: "S5.4 between-day: s02 self-paced opening, second session"}
sTwoDayOneAngle: {source: "sensitivity:s02_day2", filter: {stage: stats_kinematics, table: subjects, column: opening_angle_deg, "@pid": s02}, column: primary, agg: max, fmt: ".1f", unit: "\\degree", text: "S5.4 between-day: s02 opening angle, first session"}
sTwoDayTwoAngle: {source: "sensitivity:s02_day2", filter: {stage: stats_kinematics, table: subjects, column: opening_angle_deg, "@pid": s02}, column: variant, agg: max, fmt: ".1f", unit: "\\degree", text: "S5.4 between-day: s02 opening angle, second session"}
sTwoDayOneProtrusion: {source: "sensitivity:s02_day2", filter: {stage: stats_kinematics, table: subjects, column: protrusion_mm, "@pid": s02}, column: primary, agg: max, fmt: ".1f", unit: "\\milli\\metre", text: "S5.4 between-day: s02 protrusion, first session"}
sTwoDayTwoProtrusion: {source: "sensitivity:s02_day2", filter: {stage: stats_kinematics, table: subjects, column: protrusion_mm, "@pid": s02}, column: variant, agg: max, fmt: ".1f", unit: "\\milli\\metre", text: "S5.4 between-day: s02 protrusion, second session"}
sTwoDayOnePeakVelocity: {source: "sensitivity:s02_day2", filter: {stage: stats_kinematics, table: subjects, column: peak_open_vel_max_dps, "@pid": s02}, column: primary, agg: max, fmt: ".0f", unit: "\\degree\\per\\second", text: "S5.4 between-day: s02 peak opening angular velocity (largest cycle), first session"}
sTwoDayTwoPeakVelocity: {source: "sensitivity:s02_day2", filter: {stage: stats_kinematics, table: subjects, column: peak_open_vel_max_dps, "@pid": s02}, column: variant, agg: max, fmt: ".0f", unit: "\\degree\\per\\second", text: "S5.4 between-day: s02 peak opening angular velocity (largest cycle), second session"}
sTwoDayTwoReqOpening: {source: "sensitivity:s02_day2", filter: {stage: requirements, table: requirements, column: value, "@key": opening_mm}, column: variant, fmt: ".1f", unit: "\\milli\\metre", text: "S5.4: incisal opening design value (P95) with s02's second session"}
# S5.4: the within-session MDC95 (cohort SEM from the repeated cycles, stats_kinematics:reliability)
# that the s02 day-2 minus day-1 differences are set against (analysis plan "Between-day
# reliability").
mdcOpening: {source: "stats_kinematics:reliability", filter: {task: open_close, metric: opening_mm}, column: mdc95, fmt: ".1f", unit: "\\milli\\metre", text: "within-session MDC95 of the incisal opening, open-close"}
mdcOpeningAngle: {source: "stats_kinematics:reliability", filter: {task: open_close, metric: theta_y_deg}, column: mdc95, fmt: ".1f", unit: "\\degree", text: "within-session MDC95 of the opening angle, open-close"}
mdcPeakVelocity: {source: "stats_kinematics:reliability", filter: {task: open_close, metric: peak_open_vel_dps}, column: mdc95, fmt: ".0f", unit: "\\degree\\per\\second", text: "within-session MDC95 of the peak opening angular velocity, open-close"}
mdcProtrusion: {source: "stats_kinematics:reliability", filter: {task: protrusion_retrusion, metric: protrusion_mm}, column: mdc95, fmt: ".1f", unit: "\\milli\\metre", text: "within-session MDC95 of the protrusion"}

# -- X10 (r15a, exploratory): EMG + IMU decoding with one muscle group left out, paired with
# the main svm|emg_imu run per participant (ba_minus_full = ablated - full; median over the
# 13 adults; n_lower = participants whose accuracy dropped). Digastric sides as cabled (E37).
ablMasseter: {source: "ml_eval:variants_summary", filter: {variant: muscle_ablation, feature_set: "emg-masseter+imu", metric: ba_minus_full}, column: median, n: n, fmt: ".3f", unit: "", text: "X10: median change in balanced accuracy without the masseter (both sides) (left out minus all)"}
ablMasseterLower: {source: "ml_eval:variants_summary", filter: {variant: muscle_ablation, feature_set: "emg-masseter+imu", metric: ba_minus_full}, column: n_lower, n: n, fmt: ".0f", unit: "", text: "X10: participants whose balanced accuracy dropped without the masseter (both sides)"}
ablTemporalis: {source: "ml_eval:variants_summary", filter: {variant: muscle_ablation, feature_set: "emg-temporalis+imu", metric: ba_minus_full}, column: median, n: n, fmt: ".3f", unit: "", text: "X10: median change in balanced accuracy without the temporalis (both sides) (left out minus all)"}
ablTemporalisLower: {source: "ml_eval:variants_summary", filter: {variant: muscle_ablation, feature_set: "emg-temporalis+imu", metric: ba_minus_full}, column: n_lower, n: n, fmt: ".0f", unit: "", text: "X10: participants whose balanced accuracy dropped without the temporalis (both sides)"}
