# -- B: X5b / X5c oracle analyses (exploratory, never camera-free results; camerafree_cohort) --
# Incisor RMSE against the optics (median over participants, BCa CI; descriptive, no bound) of
# optical rotation + own model (translation-model error), camera-free rotation + optical
# translation (rotation-induced error) and the task-conditioned model (oracle class), over all
# scored tasks (rmse_inc_mm) and the rotational / translational task groups; the paired
# contrasts (Hodges-Lehmann, exact CI, Holm within X5b / X5c). Resolve only after the r11 run.
cfOracleModel: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: X5b_model, outcome: rmse_inc_mm}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, optical rotation + own translation model (translation-model error), all scored tasks (median over participants)"}
cfOracleModelRot: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: X5b_model, outcome: rmse_inc_mm_rot}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, optical rotation + own translation model (translation-model error), open-close and chewing (median over participants)"}
cfOracleModelTrans: {source: "camerafree_cohort:cf_oracle_cohort", filter: {estimator: X5b_model, outcome: rmse_inc_mm_trans}, column: median, ci: [ci_lo, ci_hi], n: n, fmt: ".1f", unit: "\\milli\\metre", text: "incisor RMSE, optical rotation + own translation model (translation-model error), protrusion and laterotrusion (median over participants)"}
