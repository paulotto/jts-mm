cfOracleConTaskOwnRot: {source: "camerafree_cohort:cf_oracle_contrasts", filter: {family: X5c, contrast: "X5c-E4own", outcome: rmse_inc_mm_rot}, column: hl, ci: [hl_ci_lo, hl_ci_hi], n: n, fmt: ".2f", unit: "\\milli\\metre", text: "contrast task-conditioned minus own model, open-close and chewing: Hodges-Lehmann shift (negative: the first is smaller)"}
cfOracleConTaskOwnRotPHolm: {source: "camerafree_cohort:cf_oracle_contrasts", filter: {family: X5c, contrast: "X5c-E4own", outcome: rmse_inc_mm_rot}, column: p_holm, fmt: ".3f", unit: "", text: "Holm p of the contrast task-conditioned minus own model, open-close and chewing"}
