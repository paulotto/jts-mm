benchImpK: {source: "bench:emg_impedance_channels", filter: {current_na: 6, channel: all}, column: k, fmt: ".2f", unit: "", text: "B1: median over the six channels of the |Z| scale k (least squares through the origin against the multimeter values), 6 nA"}
