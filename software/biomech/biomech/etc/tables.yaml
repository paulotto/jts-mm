  "ref_trueness:files": {id: val_table_trueness_files, title: "Ladder files", caption: "Ladder files used and ignored (with the reason)."}
  "ref_trueness:notes": {id: val_table_trueness_notes, title: "Ladder notes", caption: "Systems included or skipped."}
  "ref_trueness:coverage": {id: val_table_trueness_coverage, title: "Ladder coverage", caption: "Participants used by the cohort stage."}
  "ref_imu_lever:coverage": {id: val_table_imu_lever_coverage, title: "Lever-arm stage coverage", caption: "Participants used by the cohort stage (the lever arm reads the hand-eye sessions, not the participants' takes)."}
  "ref_hinge:hinge": {title: "Hinge models on both systems", caption: "Per participant, task and system (VD21, exploratory): incisor RMS residual of the best-fit fixed hinge and of the hinge through the condyle points over the same openings, the best-fit axis's distance from the condyle midpoint, and the largest fitted opening angle; JTS-MM and Qualisys each in their own head frame."}
  "ref_hinge:hinge_diff": {title: "Hinge residual, JTS-MM minus Qualisys", caption: "Per participant and task (VD21): JTS-MM minus Qualisys incisor RMS residual of both hinge models: the part tracking with JTS-MM adds to the residual."}
  "ref_budget:budget": {title: "Error budget per participant", caption: "Per participant, part (marking: registered point difference of the teeth and condyle points; motion: bias-removed jaw-in-head disagreement per gated segment) and outcome (VD22): observed difference, Qualisys uncertainty, the JTS-MM part corrected in quadrature, the adequacy ratio and the share of the observed variance the Qualisys part alone accounts for."}
  "ref_budget:coverage": {title: "Error budget: coverage", caption: "Which participants and inputs entered the error budget (VD22), with the reason where an input was missing."}
  "ref_budget:marking_holds": {title: "Marking difference per hold and its candidate causes", caption: "Per participant and marking hold (VD22): the registered point difference to Qualisys, the CT orientation disagreement of the two systems and the tip difference it predicts over the CT lever, and the share of the hold's CT frames whose labels were swapped (EV1)."}
  "ref_budget:marking_causes": {title: "Marking frame differences and their candidate causes", caption: "Per participant (VD22): the frame differences of the marking next to the CT orientation disagreement during the holds and the tip difference it predicts over the CT lever, the Qualisys head-cluster geometry, the holds with swapped CT labels (EV1) and the Qualisys uncertainty of the teeth."}
  "ref_budget:marking_gap": {title: "Marking gap between the participants", caption: "Per quantity (VD22): the reference case (smallest maxillary frame difference) and the stress case (largest), their difference and ratio; descriptive (n = 2)."}
  "ref_emg_side:side_check": {title: "EMG side check against Delsys", caption: "Per participant, profile and muscle pair (VD23): shape correlations of the mean cycle profiles of JTS-MM and Delsys between the same and the opposite sides, and the side index (+2: sides as in the code, -2: swapped, near 0: not identifiable); laterotrusion is the side-informative task."}
  "ref_camerafree:cf_val_summary": {title: "Camera-free on the comparison takes", caption: "Per participant (VD20, exploratory): mounting and lever-arm source, heading offsets and identifiability, anchors, the drift signature of the anchor residuals (heading and tilt parts) and notes."}
  "ref_camerafree:cf_val_segments": {title: "Camera-free vs Qualisys per task", caption: "Per participant, rung (the JTS-MM optics and the camera-free rungs) and movement task (and pooled): opening-angle, geodesic and incisor RMSE against Qualisys after the frame alignment used for the IMU alone, every trajectory through the dataset's 6 Hz low-pass."}
  "ref_camerafree:cf_val_noninferiority": {title: "Camera-free non-inferiority to the optics", caption: "Per participant and rung: mean paired per-frame difference of the absolute difference to Qualisys, rung minus F0 (opening angle, incisor) pooled over the movement tasks with its 1-s block-bootstrap 95 % CI, the margin (0.5 deg, 1.0 mm) and the decision (upper CI below the margin); the descriptive two-participant mean is formed in the VD20 table view."}
  "ref_camerafree:cf_val_drift": {title: "Camera-free drift vs Qualisys", caption: "Per participant: slope of the signed opening difference to Qualisys for the mountings alone against time since calibration and for the closed-pose resets against time since the last anchor, with block-bootstrap CI."}
  # -- VD24 --
  "ref_sampling:peak_ratio_acc": {title: "Peak angular acceleration, dataset chain", caption: "Per participant and pipeline (VD24, post hoc): the median ratio of the per-cycle peak |angular acceleration| of the opening angle in open-close through the dataset chain (40 Hz frames, 6 Hz low-pass, Savitzky-Golay 0.15 s; on Qualisys resampled to the JTS-MM frames and on JTS-MM) to Qualisys at 200 Hz (20 Hz low-pass, Savitzky-Golay 35 ms), with a cycle-bootstrap 95 % CI; the lower bound of the dataset's acceleration requirement.", n: "cycles per participant (n = 2 participants)", statistic: "median ratio over cycles, percentile cycle bootstrap", evidence: "post hoc description"}
  "ref_diagnostics:frame_timing": {title: "JTS-MM camera-frame timing", caption: "Per participant (VD24): the median camera-frame interval and rate, the SD of the intervals not longer than 1.5 times the median (trigger jitter) and the share, count and longest of the longer ones (dropped frames).", statistic: "SD and shares over the frame intervals of the comparison take", evidence: "descriptive"}
  "ref_diagnostics:frame_gaps": {title: "Dropped camera frames by length", caption: "Per participant and gap length (VD24): the frame intervals longer than 1.5 times the median, by their length in frame periods (2 = one missing frame, 50 ms), with count and share of all intervals.", evidence: "descriptive"}
  "ref_diagnostics:mounting_sessions": {title: "IMU mounting between hand-eye sessions", caption: "Rotation of each IMU mounting between the hand-eye calibration sessions (VD14 / VD24); a large angle is a remount (repeated per participant, the same values).", evidence: "descriptive"}
  "ref_diagnostics:mounting_folds": {title: "IMU calibration residual per fold and mounting", caption: "Per participant, leave-one-task-out fold and IMU (VD24, Part H audit): RMS residual and lag of the IMU-to-optical calibration with the mounting fitted in the take and with each hand-eye mounting held fixed (own: the session VD14 assigns to the take), and the angle between the in-take and the hand-eye mounting; per-body lag (the fusion estimator pools it, so its residuals differ slightly).", evidence: "descriptive"}
  "ref_diagnostics:mounting_residual": {title: "IMU calibration residual per mounting", caption: "Per participant, IMU and mounting (VD24): median and range over the five folds of the calibration residual, with the in-take mounting and with each hand-eye mounting; a wrong calibration date shows as a large residual.", statistic: "median and range over the folds", evidence: "descriptive"}
  "ref_assoc:cameras": {title: "Camera frame drops and time base, both takes", caption: "Per participant, take (comparison, dataset) and camera (VD26): frames, start-up triggers, drops and their rate, bursts and the residual of the live clock fit.", evidence: "descriptive"}
  "ref_assoc:counters": {title: "Frame-trigger association counters, both takes", caption: "Per participant, take and camera (VD26): the recorder's association counters.", evidence: "descriptive"}
  "ref_assoc:lag": {title: "IMU-to-camera lag, both takes", caption: "Per participant and take (VD26): lag of the jaw IMU's angular speed behind the optics (exposure-centre times) over the movement tasks, peak correlation and spread over the tasks.", evidence: "descriptive"}
  "ref_assoc:lag_windows": {title: "IMU-to-camera lag per task, both takes", caption: "Per participant, take and movement task (VD26): lag and peak correlation.", evidence: "descriptive"}
  "ref_assoc:recording": {title: "Recording metadata, both takes", caption: "Per participant and take (VD26): firmware and software version, pose method and the calibration-tool tip residual.", evidence: "descriptive"}
  "ref_assoc:fault_runs": {title: "Fault-injection replays", caption: "Every replay of a take through the recorder's frame-trigger association (VD26): fault, level, seed, and the correct, wrong and unassigned frames per camera and in total; clean: no fault; cadence_off: the ablation without the cadence step.", evidence: "descriptive"}
  "ref_assoc_cohort:levels": {title: "Fault injection per level", caption: "Per fault and level over the takes and seeds (VD26): runs, mean and largest share of wrongly assigned and of unassigned frames, and the runs with any wrong frame.", statistic: "mean and maximum over takes x seeds", evidence: "descriptive"}
  "ref_assoc_cohort:limits": {title: "Fault tolerance limits", caption: "Per fault (VD26): the largest tested level without a wrong assignment in any run, the first level with one and the share of wrong frames there.", evidence: "descriptive"}
  "ref_assoc_cohort:baseline": {title: "Fault injection baseline", caption: "Per participant and take (VD26): the replay without faults (reproduces the recorded association) and without the cadence step.", evidence: "descriptive"}
  "ref_assoc_cohort:summary": {title: "Fault injection summary", caption: "Takes, runs and seeds of the fault injection (VD26), the clean replay's correct share and the ablation's wrong share of cam0.", evidence: "descriptive"}
  "ref_assoc_cohort:coverage": {title: "Participants in the fault injection", caption: "Participants used by the fault-injection summary and the reason for any left out.", evidence: "descriptive"}
  "ref_cal_repeat:pivot_runs": {title: "Calibration-tool pivot, ten runs", caption: "Per run (VD27): poses, tip in the tool frame, tip length, RMS residual of the refitted pivot and the difference to the run's stored result.", evidence: "descriptive"}
  "ref_cal_repeat:pivot_poses": {title: "Calibration-tool pivot, poses", caption: "Per run and pose (VD27): residual of the pivot fit and the tilt from the run's mean orientation.", evidence: "descriptive"}
  "ref_cal_repeat:imu_runs": {title: "IMU mounting, ten runs", caption: "Per run and IMU (VD27): Park-Martin residual of the refitted mounting, pairs, the deviation from the mean mounting (rotation vector, IMU frame) and the difference to the run's stored result.", evidence: "descriptive"}
  "ref_cal_repeat:summary": {title: "Calibration repeatability", caption: "Per tool (VD27): per-axis SD over the ten runs (tip in mm, mounting in deg), the 3-D SD or RMS deviation, the largest deviation from the mean, the fit residuals, and for the pivot the Spearman correlation of the pose residual with the tilt.", statistic: "SD over runs; Spearman rho", evidence: "descriptive"}
  "ref_cal_repeat:notes": {title: "Calibration repeatability notes", caption: "Recordings not found, if any.", evidence: "descriptive"}
  "ref_cal_repeat:coverage": {title: "Participants in the calibration repeatability", caption: "Participants used by the cohort stage (the runs are bench recordings without a participant).", evidence: "descriptive"}
  "ref_trueness:scale": {title: "Ladder scale error", caption: "Per system and condition (VD28): scale error of a free-scale fit of the slot means with its 95 % CI, the scale error relative to Qualisys on the same simultaneously recorded ladder (CIs combined in quadrature), the residual to the metric line, the share of its square explained by the scale error and the residual without it; jtsmm_pnp: single camera (PnP, cam0).", evidence: "descriptive"}
  "ref_trueness:pnp_trueness": {title: "Ladder trueness, single camera (PnP)", caption: "As the ladder trueness table, for single-camera PnP from the cam0 images of the same recordings (VD28; the slots are the plateaus of the triangulated positions of the same frames).", evidence: "descriptive"}
  "ref_trueness:pnp_precision": {title: "Ladder precision, single camera (PnP)", caption: "As the 30-s precision table, for single-camera PnP from the cam0 images (VD28).", evidence: "descriptive"}
  "ref_diagnostics:mounting_excitation": {title: "Excitation of the in-take mounting", caption: "Per participant, fold and IMU (VD24): singular values of the relative-rotation vectors of the training frames (pairs 25 frames apart, scaled by 1/sqrt(N)); small values mean the body barely rotates about some axes and its mounting is poorly identifiable from the take.", evidence: "descriptive"}
  "ref_diagnostics:mounting_spread": {title: "Fold-to-fold spread of the in-take mounting", caption: "Per participant and IMU (VD24): largest and median pairwise angle between the in-take mountings of the leave-one-task-out folds, and the median angle of the in-take mounting to the take's own hand-eye mounting.", statistic: "pairwise angles over the five folds", evidence: "descriptive"}
  "ref_diagnostics:mounting_imu_stage": {title: "Dataset IMU calibration vs hand-eye", caption: "Per participant and hand-eye session (VD24): the dataset's imu-stage calibration (head and jaw mounting with the heading offset, fitted jointly on the take's free motion, head-piece marker frame as maxillary frame) against each hand-eye mounting: angles of the head and the jaw mounting, samples and fit residual.", evidence: "descriptive"}
  "imu_dyncal:dyncal_summary": {title: "IMU dynamic calibration (dataset take)", caption: "Per take (audit I3c): still periods of both IMUs, steps of the camera-free E2a opening error at closed samples and how many lie in or up to 2 s after a still period, against the share expected without alignment, and the drift inside and outside the still periods.", statistic: "counts, robust SD, OLS slopes", evidence: "descriptive"}
  "imu_dyncal:dyncal_periods": {title: "IMU still periods (dataset take)", caption: "Per still period (both IMUs below 2 deg/s for at least 2 s): span, phase, the net change of the pure-IMU relative orientation and the change of the opening error over the period.", evidence: "descriptive"}
  "imu_dyncal:dyncal_transitions": {title: "Opening-error jumps across phase boundaries (dataset)", caption: "Per take and pair of consecutive phases: jump of the E2a opening error across the boundary, the jump expected from the drift, their difference, the still time in the gap and the SD within the windows.", evidence: "descriptive"}
  "imu_dyncal_cohort:dyncal_transition_test": {title: "Jumps after stillness vs otherwise", caption: "Median |residual jump| of the camera-free opening error across phase transitions after at least the stillness limit, against the other transitions, over every take; a recalibration during stillness would show as larger jumps after it.", statistic: "medians; two-sided Mann-Whitney U test", evidence: "descriptive (audit)"}
  "imu_dyncal_cohort:dyncal_summary": {title: "IMU dynamic calibration, all takes", caption: "The per-take summaries of the dynamic-calibration audit side by side.", evidence: "descriptive"}
  "imu_dyncal_cohort:coverage": {title: "Takes in the dynamic-calibration audit", caption: "Per participant whether the take enters the dynamic-calibration audit and, if not, why (a take without jaw-IMU orientation has no camera-free opening error to audit).", evidence: "descriptive"}
  "ref_diagnostics:dyncal_summary": {title: "IMU dynamic calibration: difference-trace steps", caption: "Per participant (VD24, audit I3c, validation part): still periods of both IMUs, steps of the IMU-alone rotation difference to Qualisys (0.25 s block medians; threshold max(0.25 deg, 5 robust SD)) and how many lie in or up to 2 s after a still period against the share expected without alignment, and the drift inside and outside the still periods.", statistic: "counts, robust SD, OLS slopes", evidence: "descriptive"}
  "ref_diagnostics:dyncal_periods": {title: "IMU still periods", caption: "Per participant and still period (both IMUs below 2 deg/s for at least 2 s; VD24): span, phase, the net change of the pure-IMU relative orientation and the change of the IMU-alone difference to Qualisys over the period.", evidence: "descriptive"}
  "ref_diagnostics:dyncal_transitions": {title: "Difference jumps across phase boundaries", caption: "Per participant and pair of consecutive phases (VD24): jump of the IMU-alone rotation difference across the boundary, the jump expected from the drift, their difference, the still time in the gap and the SD within the windows.", evidence: "descriptive"}
