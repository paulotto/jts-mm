  "camerafree:cf_summary": {title: "Camera-free calibration and detection", caption: "Per participant (X5, exploratory): whether the camera-free estimators ran (hand-eye mounting configured) and why not, the lever-arm source and values, the rest mask, both heading offsets and whether the IMU-only one is identifiable (head-tilt range, scatter, fallback to the optical closed pose), the closed-pose threshold, anchors, detection sensitivity and precision against the optical closed runs (±0.3 s), the drift signature of the anchor residuals, the own translation model's ridge λ and inner-CV error, the in-take calibration (E1) and its identity with the calibration of the IMU opening result, and the closed-pose landmarks."}
  "camerafree:cf_rotation": {title: "Camera-free rotation per task", caption: "Per participant, rotation rung (in-take calibration; hand-eye mountings and landmark frame, heading from the optical or the IMU-detected closed pose; the same with resets at the IMU-detected closed poses, causal and offline) and task: opening-angle RMSE, bias and maximum, geodesic and per-axis rotation RMSE against the optics after the ground truth's low-pass; 'scored' pools the scored tasks; free motion (the calibration block) is not scored."}
  "camerafree:cf_translation": {title: "Camera-free translation per task", caption: "Per participant, translation rung on the primary anchored rotation (rotation about the condyle midpoint, own ridge model, accelerometer bridging between closed-pose anchors, accelerometers with the own model as pseudo-measurements; causal: forward filter) and task: incisor 3-D RMSE and maximum, per-axis RMSE and bias against the optics."}
  "camerafree:cf_cycles": {title: "Camera-free cycle amplitudes", caption: "Per movement cycle and rung: the cycle amplitude (opening angle from the cycle start, deg; largest incisor excursion from the cycle start, mm) of the estimate and of the optics and their difference (input of the repeated-measures Bland–Altman)."}
  "camerafree:cf_anchors": {title: "Camera-free closed-pose anchors", caption: "Every closed-pose anchor of the two reset rungs (optical and IMU heading): task, start, causal confirmation and end, the heading fitted there and its change since the reference (heading part), the tilt part, the residual the anchor removed (total and opening), the optical pose at the anchor window against the optical closed pose (rotation, opening, incisor) and whether an optical closed run lies within ±0.3 s."}
  "camerafree:cf_drift": {title: "Camera-free drift samples", caption: "Signed opening error (IMU − optics) of the rotation rungs at 1 Hz over the scored tasks, with time since the rest-phase reference and since the end of the last anchor window (empty before the first anchor)."}
  "camerafree:cf_decomposition": {title: "Camera-free incisor error decomposition (X5b)", caption: "Per participant and task (X5b, exploratory oracle analysis, never a camera-free result): incisor errors against the optics of the optical rotation with the own translation model driven by it (translation-model error alone), of the primary anchored IMU rotation with the optical condyle-midpoint translation (rotation-induced error alone) and of the full own-model estimate (copied from the translation table); each through the ground truth's low-pass with its own rotation. The three do not add: the full own-model estimate also contains the model's response to the rotation error."}
  "camerafree:cf_task_model": {title: "Task-conditioned translation model (X5c)", caption: "Per participant and scored task (X5c, exploratory oracle analysis): the own-model family fitted only on the free-motion calibration frames whose optical labels fall in the task's movement class (open-close and chewing: OPEN/CLOSE; protrusion: PROTRUSION/RETRUSION; laterotrusion: LEFT/RIGHT), applied with the true task label to the primary anchored IMU rotation: incisor errors against the optics, the class, its calibration samples, ridge λ and inner-CV error, and the reason when a class has no model. The upper bound of what a movement classifier (the deferred movement-class model) could achieve."}
  "camerafree_cohort:cf_participant": {title: "Camera-free values per participant", caption: "Per participant, rung and outcome: the median over the scored tasks of the task RMSE (opening, geodesic, incisor over all scored, rotational and translational tasks), the detection sensitivity and precision and the drift slopes (deg/min); the closed-pose resets rows repeat the primary anchored rung (IMU heading)."}
  "camerafree_cohort:cf_cohort": {title: "Camera-free cohort results", caption: "Per rung and outcome: participants, mean, SD, median with its 95 % BCa CI, quartiles and range of the participant values, the bound (1.2 deg, 2 mm) and the verdict (within: upper CI below the bound; compatible: median below; exceeds: lower CI above; otherwise inconclusive); the movement-class model rows are not computed (note)."}
  "camerafree_cohort:cf_contrasts": {title: "Camera-free ladder contrasts", caption: "Paired contrasts of the participant values (rotation family on the opening RMSE: mountings with optical heading − in-take fit, IMU heading − optical heading, closed-pose resets − mountings with optical heading; translation family on the incisor RMSE: own − generic model, generic model − condyle hinge, accelerometers − own model, accelerometers + own model − own model; drift: absolute slope of the closed-pose resets against the mountings with optical heading): n, Hodges–Lehmann estimate with exact 95 % CI, medians, participants better, exact Wilcoxon signed-rank p and Holm within the family."}
  "camerafree_cohort:cf_generic": {title: "Generic translation model per task", caption: "Generic model: the ridge rotation-to-translation model trained leave-one-subject-out on the optical free-motion blocks of every other participant with optics (scaled by the incisor–condyle distance), driven by the participant's anchored IMU rotation: incisor RMSE and per-axis errors per task."}
  "camerafree_cohort:cf_generic_models": {title: "Generic translation models", caption: "Per held-out participant: training participants, ridge λ, inner leave-one-participant-out error (relative to the incisor–condyle distance) and samples of the generic model."}
  "camerafree_cohort:cf_drift_slopes": {title: "Camera-free drift slopes", caption: "Per participant, rung and clock (time since the rest-phase reference; since the last anchor): OLS slope of the signed opening error (deg/min), samples and time span."}
  "camerafree_cohort:cf_drift_cohort": {title: "Camera-free drift, mixed model", caption: "Per rung and clock: random-intercept linear mixed model of the signed opening error on time (deg/min) with SE, CI and p; samples at 1 Hz are autocorrelated, so the SE is optimistic (descriptive)."}
  "camerafree_cohort:cf_cycles_ba": {title: "Camera-free cycle amplitudes, Bland–Altman", caption: "Per rung, quantity and task group: repeated-measures Bland–Altman of the cycle amplitude against the optics (bias, limits of agreement, within and between SD, participant-cluster bootstrap CIs, proportional bias) and whether the limits stay within the bound (1.2 deg, 2 mm)."}
  "camerafree_cohort:cf_oracle_participant": {title: "Camera-free oracle values per participant", caption: "Per participant, analysis (decomposition, task-conditioned model, own model as reference; X5b, X5c) and estimator: the median over the scored tasks of the task incisor RMSE (all, rotational, translational tasks) and each movement task's own incisor RMSE (one outcome per task)."}
  "camerafree_cohort:cf_oracle_cohort": {title: "Camera-free oracle cohort results", caption: "Per analysis, estimator and outcome: participants, mean, SD, median with its 95 % BCa CI, quartiles and range of the participant values; descriptive (oracle analyses: no bound, no verdict)."}
  "camerafree_cohort:cf_oracle_contrasts": {title: "Camera-free oracle contrasts", caption: "Paired contrasts of the participant incisor RMSE: camera-free rotation with optical translation − optical rotation with the own model (rotation-induced against translation-model error; rotational and translational tasks) and task-conditioned − own model (all, rotational, translational tasks): n, Hodges–Lehmann estimate with exact 95 % CI, medians, participants better, exact Wilcoxon signed-rank p and Holm within the family (exploratory)."}
  "camerafree_cohort:coverage": {title: "Participants in the camera-free statistics", caption: "Participants used (a participant without jaw IMU enters only the generic translation model's training, E32) and the reason for any left out."}

