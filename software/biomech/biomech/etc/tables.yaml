# Complete result tables: every stored stage table is shown in full by
# one registered table view (`viz/views/tables.py`): reader headers from the catalog, cells
# through the vocabulary, privacy redaction, the caption below. Curated paper tables (a
# selection of columns, own layout) are separate views; these are the complete records, for
# the viewer, supplements and data exports.
#   "stage:table": {title, caption, id (default tab_<stage>__<table>), sort (columns)}
# Rows beyond `max_rows` (default 400) are left out of the table view with a note; the full
# table: `biomech show` / `biomech export-data`.

tables:
  # == dataset study ============================================================================
  "qc:sessions": {title: "Recorded sessions", caption: "One row per participant and take: duration, phases recorded and missing, MCU logs and the integrity, EMG pre-check and HDF5 checks of the recording."}
  "qc:phases": {title: "Recorded phases", caption: "Every operator-marked phase of every take: kind, start, end and duration."}
  "qc:emg": {title: "EMG signal quality per channel", caption: "Per participant and muscle: mains frequency, rest noise, normalization reference and its source, SNR, mains share before and after cleaning, lead-off share, masked shares by reason and the usability flags."}
  "qc:emg_check": {title: "Pre-take EMG check per channel", caption: "Per participant, take and muscle: the electrode impedance from the AC lead-off tone, the check's noise and line readings with their verdicts, the take order and the minutes since the first take's check. The check ran before each take; nothing was excluded on it."}
  "qc:imu": {title: "IMU streams", caption: "Per participant, IMU slot and stream (quaternion, accelerometer): samples, achieved rate, non-monotonic time stamps, coverage and the share of unreliable samples."}
  "qc:imu_coverage": {title: "IMU coverage per phase", caption: "Share of each phase covered by each IMU stream without gaps above the threshold."}
  "qc:imu_intervals": {title: "IMU sample intervals", caption: "Per IMU stream: achieved rate, median and extreme sample intervals and the share of long intervals."}
  "qc:optical": {title: "Optical tracking lock", caption: "Per participant, body and phase: optical frames and the share with a valid body pose (lock)."}
  "qc:timeline_lanes": {title: "Recording timeline lanes", caption: "The data lanes of each take (EMG, IMU streams, optical bodies, camera previews, triggers) with their rate and lock share."}
  "qc:timeline_segments": {title: "Recording timeline segments", caption: "Contiguous data segments of every lane of each take."}
  "qc_cohort:demographics": {title: "Cohort demographics", caption: "Participants, by sex, and age (mean, SD, range)."}
  "qc_cohort:emg_flags": {title: "EMG channels flagged", caption: "EMG channels with a usability flag: shape, amplitude, rest noise, masked share, SNR and rest noise."}
  "qc_cohort:overview": {title: "Data quality overview", caption: "Per participant: EMG channels with unusable amplitude or noise-limited rest, masked share in the tasks, optical lock of both bodies and IMU quaternion coverage."}
  "qc_cohort:impedance": {title: "Electrode impedance", caption: "Per take and muscle: median, quartiles and range of the electrode impedance, channels above the 50 kΩ contact limit and above the noise and line limits, and checks passed; last rows: the paired change from the first to the second take, per participant (median over the participant's channels; n participants, exact Wilcoxon over the participants, E30) and over the participant x muscle pairs (descriptive, no test)."}
  "qc_cohort:impedance_assoc": {title: "Impedance and recorded signal quality", caption: "Rank association of the pre-take check (impedance, noise, line peak) with the recorded rest signal of the motion take: pooled Spearman ρ with a participant-resampled 95 % CI, ρ within participants and within muscles, and the rank slope with both held fixed (p, Holm over the relations)."}
  "qc_cohort:coverage": {title: "Participants in the cohort QC", caption: "Participants used by the cohort QC stage and the reason for any left out."}
  "acquisition:cameras": {title: "Camera frame drops and time base", caption: "Per participant and camera (X11): frames, start-up triggers (the camera's start, not counted as drops), dropped frames during regular operation and their rate, bursts (count, single-frame share, longest) and the residual of the live clock fit (trailing 30 frames) over the take and over the movement tasks.", evidence: "descriptive"}
  "acquisition:counters": {title: "Frame-trigger association counters", caption: "Per participant and camera (X11): the recorder's counters of the frame-trigger association (which path assigned each frame; cadence_advance counts the trigger ids skipped for dropped frames).", evidence: "descriptive"}
  "acquisition:lag": {title: "IMU-to-camera lag", caption: "Per participant (X11): lag of the jaw IMU's angular speed behind the optical one (exposure-centre times; positive: IMU later) over the movement tasks, peak correlation, the lag against the trigger edge, its spread over the tasks and the rotation glitches masked.", evidence: "descriptive"}
  "acquisition:lag_windows": {title: "IMU-to-camera lag per task", caption: "Per participant and movement task (X11): lag and peak correlation.", evidence: "descriptive"}
  "acquisition:recording": {title: "Recording metadata", caption: "Per participant (X11): firmware and software version, pose method and the calibration-tool tip residual of the take (the recording time is withheld).", evidence: "descriptive"}
  "acquisition:calibration": {title: "Stereo calibration in use", caption: "Per participant (X11): whether the take stored its calibration and tag corners (from the fifth recording day on), the median and P95 symmetric epipolar error of the corners seen by both cameras, the reprojection error after triangulation, baseline, convergence, focal lengths and the calibration's own residuals.", evidence: "descriptive"}
  "acquisition_cohort:summary": {title: "Acquisition quality, cohort", caption: "Pooled over the takes (X11): recording days, frames, drop rate and bursts, time-base residuals, whether every drop was resolved by the cadence step, IMU-to-camera lag (median, quartiles, takes more than 5 ms above the median), the calibration cross test.", evidence: "descriptive"}
  "acquisition_cohort:counter_check": {title: "Association counter check", caption: "Per participant and camera (X11): cadence_advance against the drops plus the start-up ids after the first frame; equal when every drop was resolved by the cadence step.", evidence: "descriptive"}
  "acquisition_cohort:per_session": {title: "Acquisition quality per participant", caption: "Per participant in recording order (X11): recording day, frames, drop rate and longest burst per camera, time-base RMS per camera, IMU-to-camera lag with its peak correlation and task spread, and the stereo calibration in use where stored.", evidence: "descriptive"}
  "acquisition_cohort:days": {title: "Recording days", caption: "Per recording day (X11): participants, takes with a stored calibration and the stored calibrations used (A, B, ...).", evidence: "descriptive"}
  "acquisition_cohort:calibrations": {title: "Stored stereo calibrations", caption: "Each distinct stored calibration (X11, labelled in order of first use): day, participants, baseline, convergence, focal lengths, its own residuals and the epipolar error of its recordings.", evidence: "descriptive"}
  "acquisition_cohort:cross_test": {title: "Calibration cross test", caption: "Median symmetric epipolar error of every recording with a stored calibration evaluated with every stored calibration (X11); own: the calibration the recording used.", evidence: "descriptive"}
  "acquisition_cohort:sensitivity_draws": {title: "Calibration sensitivity, draws", caption: "Per participant, scenario and draw (X11): RMS and P95 change of the mandibular-array origin in the cranial frame and RMS rotation change after perturbing the stereo extrinsics (expected: standard error of the averaged snapshots; snapshot: the scatter of one snapshot).", evidence: "descriptive"}
  "acquisition_cohort:sensitivity_rom": {title: "Calibration sensitivity, range of motion", caption: "Per participant, scenario, draw and task (X11): range of motion (P99 distance from the rest position) and its change under the perturbed extrinsics.", evidence: "descriptive"}
  "acquisition_cohort:sensitivity_summary": {title: "Calibration sensitivity, summary", caption: "Per scenario (X11): the uncertainty model (snapshots, per-axis sigma) and the median and P95 over all draws of the trajectory change, rotation change and |range-of-motion change|, also per task.", statistic: "median and P95 over draws x recordings", evidence: "descriptive"}
  "acquisition_cohort:sensitivity_notes": {title: "Calibration sensitivity notes", caption: "Why the sensitivity was skipped, if it was.", evidence: "descriptive"}
  "acquisition_cohort:coverage": {title: "Participants in the acquisition summary", caption: "Participants used by the acquisition cohort stage and the reason for any left out.", evidence: "descriptive"}
  "imu:latency_shift": {title: "IMU latency correction", caption: "Sensitivity variant imu_latency only (X11): the shift applied to the participant's IMU stamps (its measured IMU-to-camera lag).", evidence: "descriptive"}
  "kinematics:anatomy": {title: "Digitized anatomy and noise floors", caption: "Per participant: dental and condylar distances, condyle plausibility, landmark scatter, landmark-role checks, the condyles in the maxillary frame, rest noise and noise floors of the pose chain (raw and smoothed), occlusal pitch and the largest observed opening."}
  "kinematics:geometry": {title: "Jaw geometry", caption: "Per participant: Bonwill triangle side and ratio, Balkwill angle, upper and lower arch depth, condyle height above the occlusal plane, and the best-fit hinge axis of opening (radius to the incisor, offset and angle from the palpated condyles). Condyle-based values rest on skin-palpated condyle points (see the condyle plausibility flag)."}
  "kinematics:cycles": {title: "Movement cycles", caption: "Every movement cycle: timing, usability flags and the clinical measures of the cycle (opening, protrusion, lateral and deviation, rotation, condyle displacements, peak velocities)."}
  "kinematics:fha": {title: "Finite helical axes", caption: "Finite helical axis of each opening step: angle range, rotation, translation along the axis, axis direction, where it pierces the sagittal plane and its distance from the condyle midpoint."}
  "kinematics:hinge": {title: "Hinge model fits", caption: "Per participant and hinge model (best-fit hinge, hinge through the palpated condyles, hinge plus translation): residuals at the incisor, molars and condyles, the axis and its translation."}
  "kinematics:landmarks": {title: "Digitized landmarks", caption: "The digitized tooth and condyle landmarks of each participant in the maxillary frame, with their scatter during the hold."}
  "kinematics:opening_model": {title: "Opening model", caption: "Per participant: the quadratic model of incisal opening on the opening angle (coefficients, RMSE) used by the IMU opening estimate."}
  "kinematics:opening_model_loco": {title: "Opening model, leave one cycle out", caption: "Per participant and fitted open-close cycle: the opening model refitted without that cycle (coefficients, RMSE, frames), which predicts the cycle's IMU opening out of sample (D26)."}
  "kinematics:spec": {title: "Kinematic specification values", caption: "Kinematic outcomes per participant under every processing variant (input of the specification curve)."}
  "kinematics:summary": {title: "Kinematic measures per task", caption: "Per participant, task and side: median, maximum, mean, SD and coefficient of variation of each clinical measure over the cycles."}
  "emg:activation": {title: "EMG activation per task", caption: "Per participant, task and muscle: median and 95th percentile of the normalized envelope (% of the largest activity recorded), rest RMS and masked share."}
  "emg:cycles": {title: "EMG per cycle", caption: "Per movement cycle: the mean normalized activation of each muscle, whether it was masked, and the co-activation indices of opening and closing."}
  "emg:indices": {title: "EMG clenching indices", caption: "Per participant: masseter and temporalis asymmetry and the activity index from the clenching contraction, and whether they are usable."}
  "emg:mask_sensitivity": {title: "EMG mask sensitivity", caption: "Per participant, task and muscle: masked share, median activation and cycles kept under the primary masking rules and the alternative (with the low-frequency rule)."}
  "emg:mask_validation": {title: "EMG mask validation", caption: "Spectral check of the low-frequency rule: share of 20–40 Hz power and mean frequency in masked vs clean windows, per participant, task and muscle."}
  "emg:refs": {title: "EMG normalization references", caption: "Per participant and muscle: the reference contraction, its 95th percentile and largest 1-s mean, masked share, the normalization reference (largest activity recorded) and its source, MVC and task maxima and the usability flags."}
  "emg:spec": {title: "EMG specification values", caption: "EMG outcomes per participant under every processing variant (input of the specification curve)."}
  "emg:spectral": {title: "EMG spectral descriptors", caption: "Per participant, task and muscle: mean and median frequency, their within-participant SD over 0.5-s windows, windows used, usability and the power shares of four bands."}
  "emg_relevance:relevance": {title: "EMG activity relevance", caption: "Per participant, task and muscle: rest mean and SD of the normalized envelope, the activity threshold (rest mean + 3 SD, at least 5 % of the largest activity recorded), the task 95th percentile, whether the muscle is active in the task and why not (descriptive, post hoc)."}
  "imu:agreement": {title: "IMU opening-angle agreement", caption: "Per participant and task: lag, RMSE and bias of the IMU opening angle (quaternion, tilt, complementary estimator) against the optical angle."}
  "imu:bandwidth": {title: "Movement bandwidth", caption: "Per participant and task: f50/f95/f99 of the angular-velocity power from the IMU, the part confirmed by optical coherence, f95 from the optics alone (D27) and whether the estimate is noise-limited."}
  "imu:calibration": {title: "IMU calibration", caption: "Per participant: fit of the one-time IMU calibration (RMS, samples, initialization, heading, mounting and alignment rotations), dropped samples and the quaternion heading drift."}
  "imu:cycles": {title: "IMU per cycle", caption: "Per opening cycle: optical opening and angle, and the IMU estimate of the peak angle and of the opening per estimator (own model leave-one-cycle-out, D26, and in-sample), with the cycle RMSE."}
  "uncertainty:hinge_noise": {title: "Hinge residual vs noise floor", caption: "Per participant: the observed hinge residuals with their CIs, the bench and in-vivo noise-only nulls (median, 99th percentile), whether the observation exceeds them and the Monte-Carlo p; also the slow-noise, motion-scaled and teeth-only nulls (sensitivities)."}
  "labels:counts": {title: "Intent label durations", caption: "Seconds of each intent label per participant and phase."}
  "labels:label_agreement": {title: "Intent label rule change", caption: "Per participant and phase: share of labelled samples changed by the axis-scale floor and Cohen's kappa between the two labellings."}
  "labels_check:coverage": {title: "Participants in the label validity check", caption: "Participants used by the label validity check (stored labels and kinematics) and the reason for any left out."}
  "labels_check:kappa": {title: "Intent label validity (kappa)", caption: "Cohen's kappa of the automatic intent labels against a second, independent rule (opening-angle rate in open-close and chewing, incisor velocity along the task axis otherwise, fixed thresholds or thresholds raised to the participant's rest-phase noise floor), on 10 random 2-s windows per participant and phase: per participant and phase, per participant, per phase, overall, and without the frames within ±2 frames of a transition (timing vs class). The stage labels the whole rest phase REST, so its kappa is 0 whenever the second rule marks any rest frame as moving (1 only if both label every rest frame REST).", statistic: "Cohen's kappa per window set; median and range over the participants", evidence: "descriptive (label validity)"}
  "timing:onsets": {title: "EMG and mechanical onsets", caption: "Every channel-cycle: mechanical onsets (earliest, IMU velocity and acceleration, optical), the EMG onset and decision time per detector and onset rule, the leads, causal delay, anticipation, burst size and usability."}
  "timing:summary": {title: "EMG lead per participant", caption: "Per participant, task, direction, muscle, detector and onset rule: median leads over the usable channel-cycles and the causal margins."}
  "timing:ensemble": {title: "Ensemble timing per participant", caption: "Detector-free timing from cycle-aligned envelopes: agonist rise and antagonist release per participant, task and direction, with bootstrap CIs (exploratory)."}
  "timing:release": {title: "Causal release decisions", caption: "Every opening: mechanical onset, the causal closer-release decision and the anticipation (exploratory)."}
  "timing:release_summary": {title: "Causal release per participant", caption: "Per participant, task and detector setting: openings detected against chance, anticipation and false releases per minute (exploratory)."}
  "timing:lead_null": {title: "EMG lead chance null", caption: "Per participant, task, direction, detector and onset rule: the lead at 200 pseudo-onsets (each a real onset with the EMG circularly shifted against the motion, D23a; random times at least 1 s from every real onset only for tasks with pauses) with the same window, detectors, rules and usability; median lead, usable share and counts (D23)."}
  "timing:c2e_cycles": {title: "EMG-motion sequence: channel-cycles", caption: "Post hoc EMG-motion sequence family (X6): every channel-cycle of the closers (closing) and digastrics (opening): mechanical events (angular velocity, angular acceleration, optical), the TKEO onset of the driving-burst rule (task baseline) in the window around the angular-velocity onset, the leads against every event, the changepoint and symmetric-window leads, usability and its reason."}
  "timing:c2e_null": {title: "EMG-motion sequence: statistics against surrogates", caption: "Per participant, scope (task or both tasks), direction and lead source: usable channel-cycles, locking (lead IQR against 200 circular shifts of the EMG), location (mixture of a locked component and the circular-shift background), median against the circular-shift null, locking against cycle-shuffle surrogates; release rows: depth against circular shifts, per-cycle release IQR and the Theil-Sen slope against cycle-shuffle surrogates (X6, post hoc)."}
  "timing:c2e_release": {title: "EMG-motion sequence: closer release per cycle", caption: "Every opening: the window event (angular-velocity onset; optical without IMU), the cycle-shuffle anchor (end of the previous closing) and the closer release of the cycle's own envelope curve (X2 parameters; X6)."}
  "timing:coupling": {title: "EMG-to-acceleration coupling", caption: "Per participant and task: lag and peak correlation of the residualised rectified closer EMG and the closing angular acceleration (same 15 Hz filter), raw values, and the circular-shift null of the correlation (X6)."}
  "stats_kinematics:subjects": {title: "Participant kinematic values", caption: "One row per participant: every subject-level kinematic outcome, the anatomy and the noise floors."}
  "stats_kinematics:reference_values": {title: "Reference values (complete)", caption: "Every reference metric: descriptive statistics with the 95 % CI, the effect size between the sexes with its CI, and the age correlation."}
  "stats_kinematics:reliability": {title: "Within-session reliability", caption: "ICC(3,1) with its CI, SEM and MDC95 per task, side and metric."}
  "stats_kinematics:hinge_summary": {title: "Hinge model summary", caption: "Descriptive statistics of the hinge residuals per model and metric over the participants."}
  "stats_kinematics:hinge_noise_summary": {title: "Hinge residual against noise", caption: "Participants tested and above the bench and in-vivo noise floors, and the distribution of the residual-to-noise ratio."}
  "stats_kinematics:fha_summary": {title: "Helical axis summary", caption: "Descriptive statistics of the helical-axis migration over the participants."}
  "stats_kinematics:fha_subject": {title: "Helical axis per participant", caption: "Per participant: range of the axis piercing point and its distance from the condyles."}
  "stats_kinematics:condyle_sensitivity": {title: "Condyle subset sensitivity", caption: "Condyle-based outcomes (hinge residuals including the teeth-only fit, translation three ways) over all participants, over the plausible-condyle subset and over the subsets at the 30 and 50 mm depth thresholds."}
  "stats_kinematics:hinge_noise_tests": {title: "Hinge residual against each noise null", caption: "Per noise null and participant group: participants tested and above the 99th percentile, the median residual-to-noise ratio with its CI, the one-sided Wilcoxon test of log(residual / P99) > 0 and the Monte-Carlo p over participants."}
  "stats_kinematics:influence": {title: "Influence of single participants", caption: "Change of each cohort mean when one participant is left out."}
  "stats_kinematics:coupling_summary": {title: "Condyle-incisor coupling", caption: "Per participant the slope of the anterior condyle translation on the opening angle (5–15°) and how far a generic coupling curve misses the participant's own (post hoc description).", statistic: "Theil-Sen slope; RMS over the angles both curves define", evidence: "post hoc description"}
  "requirements:max_coverage": {title: "Coverage of the sample maximum", caption: "Chance that the largest of n participants exceeds the population q-quantile, 1 − q^n, and the smallest n reaching 95 % (planning; no data).", n: "no participants (closed form)", statistic: "closed form 1 − q^n", evidence: "post hoc (planning)"}
  "stats_kinematics:norms_subjects": {title: "Comparison with literature norms", caption: "Per participant and metric: value, literature reference mean and SD and the z-score."}
  "stats_kinematics:norms_summary": {title: "Norm comparison summary", caption: "Mean difference from the literature reference per metric."}
  "stats_kinematics:coverage": {title: "Participants in the kinematic statistics", caption: "Participants used and the reason for any left out."}
  "stats_emg:activation_cohort": {title: "Activation per task and muscle", caption: "Cohort descriptive statistics of the median normalized activation per task and muscle."}
  "stats_emg:activation_lmm": {title: "Activation mixed model", caption: "Linear mixed model of activation on task and muscle: coefficients with SE, z, p and CI, and the fit status."}
  "stats_emg:cci": {title: "Co-activation", caption: "Cohort descriptive statistics of the co-activation indices per task."}
  "stats_emg:indices": {title: "Clenching indices (cohort)", caption: "Cohort descriptive statistics of the asymmetry and activity indices."}
  "stats_emg:rest_activity": {title: "Rest activity", caption: "Cohort descriptive statistics of the rest activity per muscle."}
  "stats_emg:spm": {title: "SPM tests of EMG profiles", caption: "Every SPM test of the EMG cycle profiles: n, rejection, critical threshold, clusters with their p values (Holm), supra-threshold share and CMC within and between."}
  "stats_emg:spectral_cohort": {title: "Spectral spread", caption: "Mean frequency per task and muscle: cohort mean, between- and within-participant SD and their ratio, and the median frequency."}
  "stats_emg:spectral_spm": {title: "Spectral SPM", caption: "SPM along frequency: rejection, threshold, supra-threshold share and the frequency clusters."}
  "stats_emg:mask_validation": {title: "Mask validation (cohort)", caption: "Per muscle: share of conservative masks and the median change of band share and mean frequency."}
  "stats_emg:coverage": {title: "Participants in the EMG statistics", caption: "Participants used and the reason for any left out."}
  "stats_imu:imu_agreement_cohort": {title: "IMU angle agreement (cohort)", caption: "Cohort descriptive statistics of the IMU opening-angle RMSE per task and estimator."}
  "stats_imu:imu_opening_ba": {title: "IMU opening Bland–Altman (complete)", caption: "Repeated-measures Bland–Altman of IMU vs optical opening per task, estimator and model (generic leave-one-subject-out, own leave-one-cycle-out, own in-sample): bias, limits with CIs, the largest absolute limit with its MOVER and cluster-bootstrap CIs (D26), proportional bias, RMSE and the within/between SD."}
  "stats_imu:imu_opening_cycles": {title: "IMU opening per cycle", caption: "Every opening cycle: optical and IMU angles and openings under the own (leave-one-cycle-out and in-sample) and the leave-one-subject-out model."}
  "stats_imu:coverage": {title: "Participants in the IMU statistics", caption: "Participants used (a participant without IMU data enters the optical inputs; the reason names what it lacks, E32) and the reason for any left out."}
  "stats_timing:timing_cohort": {title: "EMG timing (complete)", caption: "Every timing metric per task, direction, detector and onset rule: descriptive statistics, CI, participants excluded by the minimum of usable channel-cycles, the signed-rank test (W, p, effect size r) and Holm p within its family; for the lead also the chance null, observed minus null and its one-sided signed-rank and sign-flip permutation tests with Holm p in the same families (D23)."}
  "stats_timing:timing_spec": {title: "Timing specification values", caption: "Timing outcomes per participant under every processing variant (input of the specification curve)."}
  "stats_timing:timing_usability": {title: "Onset usability", caption: "Per participant, task, direction, detector and rule: share of usable channel-cycles and of channels active at the start."}
  "stats_timing:ensemble_cohort": {title: "Ensemble timing (cohort)", caption: "Agonist rise and antagonist release per task and direction: participants with the event, before onset, descriptive statistics, CI and signed-rank test (exploratory)."}
  "stats_timing:release_cohort": {title: "Causal release (cohort)", caption: "Per task and detector setting: detection against chance, false releases, the anticipation statistics with the signed-rank test, and the anticipation against its chance level with the paired signed-rank test (exploratory; D23)."}
  "stats_timing:timing_null": {title: "EMG lead against chance", caption: "Per participant, task, direction, detector and onset rule: the observed lead, its chance null and their difference, the usable share of the null and its counts (D23; the input of the calibrated test in the timing table)."}
  "stats_timing:c2e_cohort": {title: "EMG-motion sequence: cohort tests and decision", caption: "Post hoc EMG-motion sequence family (X6): H1 closers lead closing (intersection-union of locking and location against the bias margin), H2/H3 closer release before opening (serial gatekeeping, Holm), the supporting block (Holm within the block; veto rows), structure rows (cycle-shuffle surrogates) and the decision."}
  "stats_timing:coverage": {title: "Participants in the timing statistics", caption: "Participants used and the reason for any left out."}
  "variability:spec_curve": {title: "Specification curve summary", caption: "Per outcome: variants, primary variant and value, the range over variants and its size relative to the between-participant SD."}
  "variability:spec_values": {title: "Specification values", caption: "Every outcome value per participant and processing variant."}
  "variability:cycles_needed": {title: "Cycles needed", caption: "Per task, metric, side and participant: cycles available and cycles needed for the target CI half-width."}
  "variability:protocol": {title: "Protocol heterogeneity", caption: "Spread of protocol quantities (durations, cycles) over the participants."}
  "variability:coverage": {title: "Participants in the variability analysis", caption: "Participants used and the reason for any left out."}
  "requirements:requirements": {title: "Derived requirements (complete)", caption: "Every derived requirement: value with its interval, median, statistic, n, derivation, evidence level, implication and note; capacity rows: Harrell–Davis P95, linear P95, order-statistic lower bound and the maximum (E31); latency rows: chance null and onset-source sensitivity (D23, D31); IMU rows: MOVER and bootstrap intervals (D26)."}
  "requirements:requirements_sensitivity": {title: "Requirements, sensitivity", caption: "Workspace and speed requirements from the largest cycle of the task per participant, the bandwidth from the IMU alone and from the optics alone (D27), and the bandwidth with the noise-limited rule at 1.5 and 3 Hz instead of 2 Hz (D29), each next to the primary design value."}
  "requirements:coverage": {title: "Participants in the requirements", caption: "Participants used (a participant without IMU data enters the optical inputs; the reason names what it lacks, E32) and the reason for any left out."}
  "ml_windows:meta": {title: "Decoding windows", caption: "Per participant: windows, masked and gap windows, label and normalization settings."}
  "ml_windows:refs": {title: "Decoding EMG references", caption: "Per participant and muscle: the rest-relative EMG reference and threshold of the decoding features."}
  "ml_windows:features": {title: "Decoding features", caption: "The features of each block (EMG, IMU, sequence)."}
  "ml_eval:summary": {title: "Decoding results (complete)", caption: "Per protocol, feature set, model and metric: descriptive statistics over the participants with the CI."}
  "ml_eval:loso": {title: "Decoding per held-out participant", caption: "Leave-one-subject-out folds: tuned parameters, balanced accuracy, macro F1, latency, detected share and false activations."}
  "ml_eval:blocked": {title: "Within-participant decoding", caption: "Blocked cross-validation per participant with the hyper-parameters the leave-one-subject-out search chose for that participant's fold: balanced accuracy and macro F1."}
  "ml_eval:blocked_default": {title: "Within-participant decoding, default settings", caption: "Blocked cross-validation per participant with the model's default hyper-parameters (sensitivity): balanced accuracy and macro F1."}
  "ml_eval:tests": {title: "Decoding tests", caption: "Every decoding test: statistic, p (Holm), n, permutation null and the participants better."}
  "ml_eval:variants": {title: "Decoding variants per participant", caption: "Few-shot calibration, late fusion and reduced EMG block per participant: balanced accuracy, macro F1, test windows, weights and fit times (exploratory)."}
  "ml_eval:variants_summary": {title: "Decoding variants (cohort)", caption: "Median and IQR of the decoding variants over the participants (exploratory)."}
  "ml_eval:permutation_importance": {title: "Feature-block importance", caption: "Per participant: balanced accuracy with each feature block permuted and the drop."}
