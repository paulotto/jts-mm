noise_fail_n: {label: "Channels above noise limit", symbol: "", unit: "", decimals: 0, desc: "Channels whose check noise exceeded the limit", range: [0, 1000]}
line_fail_n: {label: "Channels above line limit", symbol: "", unit: "", decimals: 0, desc: "Channels whose check line peak exceeded the limit", range: [0, 1000]}
