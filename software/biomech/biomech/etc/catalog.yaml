# Metric and signal catalog: one entry per column name that leaves a stage.
# Used by tables, the TikZ exporter and the viewer so every number is labelled,
# unit-tagged and rounded the same way everywhere (an08 §3).
#   label     human-readable name
#   symbol    LaTeX math (without $)
#   unit      siunitx unit string ("" = dimensionless)
#   decimals  rounding for tables
#   desc      one-line definition
#   range     plausible [min, max] (biomech check-outputs flags values outside)

duration_s:        {label: "Duration", symbol: "T", unit: "\\second", decimals: 1, desc: "Span of a take (qc) or of a movement cycle (kinematics)", range: [0.05, 7200]}
phase_s:           {label: "Phase duration", symbol: "T_{\\mathrm{ph}}", unit: "\\second", decimals: 1, desc: "Operator-marked phase length"}
lock_frac:         {label: "Tracking lock", symbol: "\\lambda", unit: "", decimals: 2, desc: "Share of optical frames with a valid body pose"}
quat_rate_hz:      {label: "Quaternion rate", symbol: "f_q", unit: "\\hertz", decimals: 0, desc: "Median IMU quaternion rate"}
accel_rate_hz:     {label: "Accelerometer rate", symbol: "f_a", unit: "\\hertz", decimals: 0, desc: "Median IMU accelerometer rate"}
quat_coverage:     {label: "Quaternion coverage", symbol: "c_q", unit: "", decimals: 2, desc: "Share of phase time without a quaternion gap above the threshold"}
nonmono_n:         {label: "Non-monotonic stamps", symbol: "n_{\\downarrow}", unit: "", decimals: 0, desc: "IMU timestamps not strictly increasing"}
acc0_frac:         {label: "Unreliable share", symbol: "u_0", unit: "", decimals: 3, desc: "Share of IMU samples with accuracy 0"}
rest_rms_uv:       {label: "Rest RMS", symbol: "\\sigma_{\\mathrm{rest}}", unit: "\\micro\\volt", decimals: 1, desc: "Cleaned 20–450 Hz RMS in the rest phase"}
ref_p95_uv:        {label: "Reference envelope", symbol: "E_{\\mathrm{ref}}", unit: "\\micro\\volt", decimals: 1, desc: "95th percentile of the RMS envelope in the channel's MVC/RVC phase"}
ref_mask_frac:     {label: "Reference masked", symbol: "m_{\\mathrm{ref}}", unit: "", decimals: 3, desc: "Masked share of the whole MVC/RVC phase (diagnostic)", range: [0, 1]}
ref_mask_frac_effort: {label: "Reference efforts masked", symbol: "m_{\\mathrm{eff}}", unit: "", decimals: 3, desc: "Masked share of the MVC/RVC samples with envelope >= 25 % of its p95; amplitude usability needs <= 0.10", range: [0, 1]}
ref_uv:            {label: "Normalization reference", symbol: "E_{\\max}", unit: "\\micro\\volt", decimals: 1, desc: "Largest masked 150 ms envelope recorded for the channel: MVC/RVC phase or any task (D11)"}
ref_source:        {label: "Reference source", symbol: "", unit: "", decimals: 0, desc: "mvc: the reference contraction holds the maximum; task: a task exceeded it (failed/submaximal reference)"}
mvc_over_task:     {label: "MVC / task maximum", symbol: "", unit: "", decimals: 2, desc: "Largest envelope in the MVC/RVC phase divided by the largest in the tasks (< 1: reference from a task)", range: [0, 50]}
snr_db:            {label: "SNR", symbol: "\\mathrm{SNR}", unit: "\\decibel", decimals: 1, desc: "20 log10(E_ref / median rest envelope)"}
mains_share_raw:   {label: "Mains share (raw)", symbol: "m_{\\mathrm{raw}}", unit: "", decimals: 2, desc: "In-band power at line harmonics before cleaning"}
mains_share_clean: {label: "Mains share (clean)", symbol: "m", unit: "", decimals: 2, desc: "In-band power at line harmonics after cleaning"}
leadoff_frac:      {label: "Lead-off share", symbol: "\\ell", unit: "", decimals: 3, desc: "Share of samples with the channel's lead-off bit set"}
upper_intermolar_mm:      {label: "Upper intermolar width", symbol: "w_{\\mathrm{u}}", unit: "\\milli\\metre", decimals: 1, desc: "Distance between the digitized upper second molars (max_point_2/3)"}
lower_intermolar_mm:      {label: "Lower intermolar width", symbol: "w_{\\mathrm{l}}", unit: "\\milli\\metre", decimals: 1, desc: "Distance between the digitized lower second molars (mand_point_2/3)"}
intercondylar_mm:         {label: "Intercondylar distance", symbol: "w_{\\mathrm{c}}", unit: "\\milli\\metre", decimals: 1, desc: "Distance between the skin-palpated condyles (tmj_left/right)"}
condyle_incisor_left_mm:  {label: "Condyle-incisor distance L", symbol: "d_{\\mathrm{cL}}", unit: "\\milli\\metre", decimals: 1, desc: "Lower incisor to left skin-palpated condyle"}
condyle_incisor_right_mm: {label: "Condyle-incisor distance R", symbol: "d_{\\mathrm{cR}}", unit: "\\milli\\metre", decimals: 1, desc: "Lower incisor to right skin-palpated condyle"}
condyles_plausible:       {label: "Condyles plausible", symbol: "", unit: "", decimals: 0, desc: "Both condyle-incisor distances >= 70 mm, both condyle points >= 5 mm above the incisal level (E13) and the side-mean depth behind the upper incisor >= 40 mm (D18, reason too_shallow)"}
condyles_reason:          {label: "Condyle check", symbol: "", unit: "", decimals: 0, desc: "Why implausible: too_close, too_shallow, below_incisal_level, or a level or depth that could not be determined (condyle_level_unknown, condyle_depth_unknown)"}
occlusal_pitch_deg:       {label: "Occlusal pitch", symbol: "", unit: "\\degree", decimals: 1, desc: "Lower occlusal line (incisor to molar midpoint) at closure in the maxillary frame; large values point at a tilted frame", range: [-45, 45]}

# -- kinematics (per cycle) -------------------------------------------------------------------
opening_mm:            {label: "Opening", symbol: "o", unit: "\\milli\\metre", decimals: 1, desc: "Vertical incisal displacement at the cycle peak (about 0 in protrusion/laterotrusion)", range: [-5, 80]}
mio_mm:                {label: "Maximum incisal opening", symbol: "", unit: "\\milli\\metre", decimals: 1, desc: "Largest incisal opening of the participant (specification-curve outcome)"}
cycle_duration_s:      {label: "Cycle duration", symbol: "", unit: "\\second", decimals: 2, desc: "Duration of a movement cycle (protocol summary item)"}
mvc_reference_masked_frac_max: {label: "Largest masked share of a reference", symbol: "", unit: "", decimals: 3, desc: "Largest masked share of any channel's MVC/RVC reference phase (protocol summary item)"}
protrusion_mm:         {label: "Protrusion", symbol: "p", unit: "\\milli\\metre", decimals: 1, desc: "Anterior incisal displacement at the peak (negative while opening: the incisor travels back)", range: [-35, 25]}
lateral_mm:            {label: "Laterotrusion", symbol: "l", unit: "\\milli\\metre", decimals: 1, desc: "Lateral incisal displacement at the peak (left +)", range: [-25, 25]}
theta_y_deg:           {label: "Opening angle", symbol: "\\theta", unit: "\\degree", decimals: 1, desc: "Sagittal rotation at the peak", range: [-10, 60]}
peak_open_vel_dps:     {label: "Peak opening velocity", symbol: "\\dot\\theta", unit: "\\degree\\per\\second", decimals: 0, desc: "Largest angular velocity while opening (about 0 in protrusion/laterotrusion)", range: [-20, 1500]}
rms_incisor_mm:        {label: "Incisal residual", symbol: "r_i", unit: "\\milli\\metre", decimals: 2, desc: "RMS misalignment of a joint model at the incisor", range: [0, 30]}
translation_range_mm:  {label: "Translation range", symbol: "\\tau", unit: "\\milli\\metre", decimals: 1, desc: "5-95 % range of the fitted translation; trades off against the axis height, not identifiable in vivo (D10)", range: [0, 80]}
# -- EMG / timing -------------------------------------------------------------------------------
p95_uv:                {label: "Reference (p95)", symbol: "E_{95}", unit: "\\micro\\volt", decimals: 1, desc: "p95 of the masked MVC/RVC envelope", range: [0, 5000]}
lead_ms:               {label: "EMG lead", symbol: "\\Delta t", unit: "\\milli\\second", decimals: 0, desc: "Mechanical onset minus EMG onset", range: [-600, 600]}
anticipation_ms:       {label: "Causal margin", symbol: "\\Delta t_c", unit: "\\milli\\second", decimals: 0, desc: "Mechanical onset minus causal decision", range: [-800, 600]}
causal_delay_ms:       {label: "Detector delay", symbol: "d_c", unit: "\\milli\\second", decimals: 0, desc: "Causal decision minus offline onset (at most the 800 ms search window)", range: [0, 800]}
# -- IMU / decoding ------------------------------------------------------------------------------
rmse_quat_deg:         {label: "IMU angle RMSE", symbol: "e_q", unit: "\\degree", decimals: 2, desc: "Quaternion-estimator opening angle vs optical", range: [0, 45]}
balanced_accuracy:     {label: "Balanced accuracy", symbol: "BA", unit: "", decimals: 2, desc: "Mean per-class recall", range: [0, 1]}
macro_f1:              {label: "Macro F1", symbol: "F_1", unit: "", decimals: 2, desc: "Mean per-class F1 over the classes present", range: [0, 1]}
f95_coh_hz:        {label: "f95, confirmed", symbol: "f_{95}^{coh}", unit: "\\hertz", decimals: 2, desc: "f95 of the IMU angular-velocity power weighted by the bias-corrected IMU-optical coherence (D12)", range: [0, 20]}
f99_coh_hz:        {label: "f99, confirmed", symbol: "f_{99}^{coh}", unit: "\\hertz", decimals: 2, desc: "f99 of the coherence-weighted power (D12)", range: [0, 20]}
coh_band_hz:       {label: "Coherent band", symbol: "", unit: "\\hertz", decimals: 2, desc: "Upper edge of the band where the bias-corrected IMU-optical coherence >= 0.5", range: [0, 20]}
noise_limited:     {label: "Noise-limited", symbol: "", unit: "", decimals: 0, desc: "Coherent band below 2 Hz (IMU-optical coherence >= 0.5 counts as shared movement), or no coherent band at all: the opening angle does not carry the task's motion (D12)"}

# -- identifiers and generic counts (table browser and TableSpec headers)
task:              {label: "Task", symbol: "", unit: "", decimals: 0, desc: "Protocol phase"}
muscle:            {label: "Muscle", symbol: "", unit: "", decimals: 0, desc: "EMG channel"}
n:                 {label: "n", symbol: "n", unit: "", decimals: 0, desc: "Number of participants (or units) entering the value"}
# -- EMG frequency domain (an03 §5, X1)
mnf_hz:            {label: "Mean frequency", symbol: "f_{\\mathrm{mean}}", unit: "\\hertz", decimals: 1, desc: "Power-weighted mean frequency of the cleaned EMG (Welch, 0.5-s segments)", range: [20, 450]}
mdf_hz:            {label: "Median frequency", symbol: "f_{\\mathrm{med}}", unit: "\\hertz", decimals: 1, desc: "Frequency halving the in-band power", range: [20, 450]}
mnf_mean_hz:       {label: "Mean MNF", symbol: "\\bar f_{\\mathrm{mean}}", unit: "\\hertz", decimals: 1, desc: "Cohort mean of the participants' mean frequency"}
mdf_mean_hz:       {label: "Mean MDF", symbol: "\\bar f_{\\mathrm{med}}", unit: "\\hertz", decimals: 1, desc: "Cohort mean of the participants' median frequency"}
mnf_sd_between_hz: {label: "MNF SD between", symbol: "s_b", unit: "\\hertz", decimals: 1, desc: "SD of the mean frequency between participants"}
mnf_sd_within_hz:  {label: "MNF SD within", symbol: "s_w", unit: "\\hertz", decimals: 1, desc: "Pooled SD of the mean frequency over 0.5-s windows within a participant"}
between_over_within: {label: "Between / within SD", symbol: "s_b/s_w", unit: "", decimals: 2, desc: "Between- over within-participant SD (> 1: who is measured matters more)"}
share_20_50:       {label: "Power share 20-50 Hz", symbol: "", unit: "", decimals: 3, desc: "Share of the 20-450 Hz power", range: [0, 1]}
share_50_100:      {label: "Power share 50-100 Hz", symbol: "", unit: "", decimals: 3, desc: "Share of the 20-450 Hz power", range: [0, 1]}
share_100_200:     {label: "Power share 100-200 Hz", symbol: "", unit: "", decimals: 3, desc: "Share of the 20-450 Hz power", range: [0, 1]}
share_200_450:     {label: "Power share 200-450 Hz", symbol: "", unit: "", decimals: 3, desc: "Share of the 20-450 Hz power", range: [0, 1]}
n_windows:         {label: "Windows", symbol: "K", unit: "", decimals: 0, desc: "Welch segments entering a spectrum"}
share_20_40_masked: {label: "20-40 Hz share, flagged", symbol: "", unit: "", decimals: 3, desc: "Median 20-40 Hz power share of windows hit by the low-frequency rule"}
share_20_40_clean: {label: "20-40 Hz share, clean", symbol: "", unit: "", decimals: 3, desc: "Median 20-40 Hz power share of windows without any rule hit"}
mnf_masked_hz:     {label: "MNF, flagged", symbol: "", unit: "\\hertz", decimals: 1, desc: "Median mean frequency of windows hit by the low-frequency rule"}
mnf_clean_hz:      {label: "MNF, clean", symbol: "", unit: "\\hertz", decimals: 1, desc: "Median mean frequency of windows without any rule hit"}
conservative:      {label: "Conservative", symbol: "", unit: "", decimals: 0, desc: "Flagged windows look like clean ones (medians inside the clean IQR)"}
conservative_frac: {label: "Conservative share", symbol: "", unit: "", decimals: 2, desc: "Share of channel-tasks whose flagged windows look clean", range: [0, 1]}
d_share_median:    {label: "Δ 20-40 Hz share", symbol: "", unit: "", decimals: 3, desc: "Median flagged − clean difference of the 20-40 Hz share"}
d_mnf_median_hz:   {label: "Δ MNF", symbol: "", unit: "\\hertz", decimals: 1, desc: "Median flagged − clean difference of the mean frequency"}
line_hz:           {label: "Line frequency", symbol: "f_0", unit: "\\hertz", decimals: 3, desc: "Grid frequency measured in the take", range: [49, 61]}
supra_frac:        {label: "Supra-threshold share", symbol: "", unit: "", decimals: 2, desc: "Share of the SPM field above the critical threshold", range: [0, 1]}
zstar:             {label: "Critical threshold", symbol: "z^*", unit: "", decimals: 2, desc: "SPM critical value (random field theory or permutation)"}
clusters_hz:       {label: "Clusters", symbol: "", unit: "\\hertz", decimals: 0, desc: "Supra-threshold clusters (start, end, p) along frequency"}
usable_shape:      {label: "Shape usable", symbol: "", unit: "", decimals: 0, desc: "SNR >= 6 dB: channel enters shape analyses (an01 §3)"}
ok:                {label: "Valid", symbol: "", unit: "", decimals: 0, desc: "Cycle passes the cycle checks"}
# -- IMU bandwidth (an04 §6, D12)
f50_hz:            {label: "f50", symbol: "f_{50}", unit: "\\hertz", decimals: 2, desc: "Frequency below which 50 % of the IMU angular-velocity power lies", range: [0, 100]}
f95_hz:            {label: "f95", symbol: "f_{95}", unit: "\\hertz", decimals: 2, desc: "Frequency below which 95 % of the IMU angular-velocity power lies", range: [0, 100]}
f99_hz:            {label: "f99", symbol: "f_{99}", unit: "\\hertz", decimals: 2, desc: "Frequency below which 99 % of the IMU angular-velocity power lies", range: [0, 100]}
chewing_freq_hz:   {label: "Chewing frequency", symbol: "f_{\\mathrm{chew}}", unit: "\\hertz", decimals: 2, desc: "Chewing cycles per second", range: [0.3, 4]}
# -- EMG masks (D14)
mask_lowfreq_frac: {label: "Low-frequency flag share", symbol: "", unit: "", decimals: 3, desc: "Share of task samples hit by the low-frequency rule (flag only since D14)", range: [0, 1]}
lowfreq_flag:      {label: "Low-frequency flag", symbol: "", unit: "", decimals: 0, desc: "More than 10 % of the task samples hit by the low-frequency rule (QC flag, D14)"}
mask_frac_alt:     {label: "Masked share (with LF rule)", symbol: "", unit: "", decimals: 3, desc: "Masked share when the low-frequency rule also excludes (D14 sensitivity)", range: [0, 1]}
kept:              {label: "Cycles kept", symbol: "", unit: "", decimals: 0, desc: "Channel-cycles with <= 10 % masked samples (primary masks)"}
kept_alt:          {label: "Cycles kept (with LF rule)", symbol: "", unit: "", decimals: 0, desc: "Channel-cycles kept when the low-frequency rule also excludes (D14 sensitivity)"}
n_cycles:          {label: "Cycles", symbol: "", unit: "", decimals: 0, desc: "Valid kinematic cycles of the task"}
median_pct_alt:    {label: "Median activation (with LF rule)", symbol: "", unit: "\\percent", decimals: 1, desc: "Median activation when the low-frequency rule also excludes (own reference)"}
bias:              {label: "Bias", symbol: "\\bar d", unit: "\\milli\\metre", decimals: 2, desc: "Mean difference estimate - reference (repeated-measures Bland-Altman, D7)"}
loa_lo:            {label: "Lower limit of agreement", symbol: "\\mathrm{LoA}_-", unit: "\\milli\\metre", decimals: 2, desc: "bias - 1.96 SD of a single difference (within + between participants)"}
loa_hi:            {label: "Upper limit of agreement", symbol: "\\mathrm{LoA}_+", unit: "\\milli\\metre", decimals: 2, desc: "bias + 1.96 SD of a single difference"}
bias_ci_lo:        {label: "Bias, CI low", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Lower 95 % CI bound of the bias: participant-cluster bootstrap (2000) in the dataset study (D7); t-interval with the effective n of the autocorrelated cycle differences for the validation cycle features (EV6)"}
bias_ci_hi:        {label: "Bias, CI high", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Upper 95 % CI bound of the bias: participant-cluster bootstrap in the dataset study (D7); t-interval with the effective n of the cycles for the validation cycle features (EV6)"}
loa_lo_ci_lo:      {label: "Lower LoA, CI low", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Participant-cluster bootstrap CI of the lower limit"}
loa_lo_ci_hi:      {label: "Lower LoA, CI high", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Participant-cluster bootstrap CI of the lower limit"}
loa_hi_ci_lo:      {label: "Upper LoA, CI low", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Participant-cluster bootstrap CI of the upper limit"}
loa_hi_ci_hi:      {label: "Upper LoA, CI high", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Participant-cluster bootstrap CI of the upper limit"}
prop_slope:        {label: "Proportional bias", symbol: "\\beta", unit: "", decimals: 3, desc: "OLS slope of the difference on the mean of the two methods (cycle level)"}
prop_slope_ci_lo:  {label: "Proportional bias, CI low", symbol: "", unit: "", decimals: 3, desc: "Participant-cluster bootstrap CI"}
prop_slope_ci_hi:  {label: "Proportional bias, CI high", symbol: "", unit: "", decimals: 3, desc: "Participant-cluster bootstrap CI"}

# -- validation study (systems paper) and table identity columns -------------------
pid: {label: "Participant", symbol: "", unit: "", decimals: 0, desc: "Participant pseudonym (P1, P2, ...)"}
segment: {label: "Task", symbol: "", unit: "", decimals: 0, desc: "Task or segment of the take"}
feature: {label: "Feature", symbol: "", unit: "", decimals: 0, desc: "Cycle feature"}
system: {label: "System", symbol: "", unit: "", decimals: 0, desc: "Measurement system"}
transform: {label: "Transform", symbol: "", unit: "", decimals: 0, desc: "Constant frame offset or registration"}
fold: {label: "Held-out task", symbol: "", unit: "", decimals: 0, desc: "Task left out when fitting the frame alignment"}
orientation: {label: "Orientation", symbol: "", unit: "", decimals: 0, desc: "Ladder orientation relative to the cameras"}
distance: {label: "Camera distance", symbol: "", unit: "", decimals: 0, desc: "Ladder distance from the cameras"}
estimator: {label: "Estimator", symbol: "", unit: "", decimals: 0, desc: "Orientation/position estimator of the optical + IMU fusion"}
evidence: {label: "Evidence", symbol: "", unit: "", decimals: 0, desc: "Evidence level: pre-specified test, pre-specified description, exploratory"}
outcome: {label: "Outcome", symbol: "", unit: "", decimals: 0, desc: "Outcome compared across sensitivity runs"}
metric: {label: "Metric", symbol: "", unit: "", decimals: 0, desc: "Metric"}
incisor_rms_mm: {label: "Incisor RMS difference", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "3-D RMS of the incisor position difference between the systems"}
incisor_dyn_rms_mm: {label: "Incisor RMS, bias removed", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "3-D RMS of the incisor difference after removing its mean (dynamic part)"}
incisor_bias_x_mm: {label: "Incisor bias, anterior", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Mean incisor difference along the anterior axis"}
incisor_bias_y_mm: {label: "Incisor bias, left", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Mean incisor difference along the left axis"}
incisor_bias_z_mm: {label: "Incisor bias, superior", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Mean incisor difference along the superior axis"}
incisor_sd_x_mm: {label: "Incisor SD, anterior", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "SD of the incisor difference along the anterior axis"}
incisor_sd_y_mm: {label: "Incisor SD, left", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "SD of the incisor difference along the left axis"}
incisor_sd_z_mm: {label: "Incisor SD, superior", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "SD of the incisor difference along the superior axis"}
rot_rms_deg: {label: "Rotation RMS difference", symbol: "", unit: "\\degree", decimals: 2, desc: "RMS of the angle of the relative rotation between the systems"}
rot_dyn_rms_deg: {label: "Rotation RMS, bias removed", symbol: "", unit: "\\degree", decimals: 2, desc: "Rotation difference RMS after removing the constant rotation"}
rot_bias_rx_deg: {label: "Rotation bias about x", symbol: "", unit: "\\degree", decimals: 2, desc: "Mean rotation difference about the anterior axis"}
rot_bias_ry_deg: {label: "Rotation bias about y", symbol: "", unit: "\\degree", decimals: 2, desc: "Mean rotation difference about the left axis"}
rot_bias_rz_deg: {label: "Rotation bias about z", symbol: "", unit: "\\degree", decimals: 2, desc: "Mean rotation difference about the superior axis"}
incisor_rom_mm: {label: "Incisor range of motion", symbol: "", unit: "\\milli\\metre", decimals: 1, desc: "Range of the Qualisys incisor position in the segment"}
incisor_rel_pct: {label: "Incisor RMS / range", symbol: "", unit: "\\percent", decimals: 1, desc: "Incisor RMS difference as a percentage of the range of motion"}
tmj_left_rms_mm: {label: "Left condyle RMS difference", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "3-D RMS of the left condyle point difference"}
tmj_left_dyn_rms_mm: {label: "Left condyle RMS, bias removed", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Left condyle difference RMS after removing its mean"}
tmj_right_rms_mm: {label: "Right condyle RMS difference", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "3-D RMS of the right condyle point difference"}
tmj_right_dyn_rms_mm: {label: "Right condyle RMS, bias removed", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Right condyle difference RMS after removing its mean"}
rot_deg: {label: "Rotation", symbol: "", unit: "\\degree", decimals: 2, desc: "Rotation angle of a constant frame offset"}
trans_mm: {label: "Translation", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Translation of a constant frame offset"}
amp_mm: {label: "Incisal amplitude", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Peak-to-peak incisal displacement of a cycle"}
excursion_mm: {label: "Incisal excursion", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Largest incisal distance from the cycle start"}
peak_speed_mm_s: {label: "Peak incisal speed", symbol: "", unit: "\\milli\\metre\\per\\second", decimals: 1, desc: "Largest incisal speed in a cycle"}
rot_excursion_deg: {label: "Rotation excursion", symbol: "", unit: "\\degree", decimals: 2, desc: "Largest jaw rotation from the cycle start"}
tmj_excursion_mm: {label: "Condyle excursion", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Largest condyle-point distance from the cycle start"}
ccc: {label: "CCC", symbol: "", unit: "", decimals: 3, desc: "Lin's concordance correlation coefficient"}
icc_a1: {label: "ICC(A,1)", symbol: "", unit: "", decimals: 3, desc: "Intraclass correlation, absolute agreement, single measures"}
pearson_r: {label: "Pearson r", symbol: "", unit: "", decimals: 3, desc: "Pearson correlation"}
mean_q: {label: "Qualisys mean", symbol: "", unit: "", decimals: 2, desc: "Mean of the reference values"}
equivalent_metrology: {label: "Within metrology bound", symbol: "", unit: "", decimals: 0, desc: "95 % CI of the bias inside the ±0.5 mm / ±0.5° bound"}
equiv_margin: {label: "Equivalence margin", symbol: "", unit: "", decimals: 2, desc: "Smallest symmetric bound the 95 % CI of the bias (features) or the whole 95 % band of the mean difference curve (waveforms) lies inside; both are effective-n t-intervals of the cycle differences in time order (features EV6, waveform band per node EV14); mm for distances, deg for rotations (VD13)"}
equivalent_application: {label: "Within application bound", symbol: "", unit: "", decimals: 0, desc: "95 % CI of the bias inside the ±2.0 mm / ±1.2° application bound"}
frame_max_deg: {label: "Maxillary frame difference", symbol: "", unit: "\\degree", decimals: 1, desc: "Angle between the systems' maxillary frames built from the marked points"}
frame_mand_deg: {label: "Mandibular frame difference", symbol: "", unit: "\\degree", decimals: 1, desc: "Angle between the systems' mandibular frames built from the marked points"}
precision_jtsmm_mad_mm: {label: "Static precision JTS-MM (MAD)", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Median absolute deviation of the JTS-MM tip within a hold"}
precision_qualisys_mad_mm: {label: "Static precision Qualisys (MAD)", symbol: "", unit: "\\milli\\metre", decimals: 2, desc: "Median absolute deviation of the Qualisys tip within a hold"}
