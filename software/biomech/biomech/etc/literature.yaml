# Literature reference values (J7).
# Unhashed: read by table_reference / the literature view, so editing it needs no re-run.
#
# Only verified values: each reference is checked against two indexes (Crossref + PubMed or
# Semantic Scholar, see docs/analysis/references.bib), and each value is quoted from the
# abstract or the open full text named in `note`. Nothing here is estimated or converted
# except where `note` says so.
#
# Fields:
#   quantity    the dataset column name where one matches (stats/cohort_kinematics.py METRICS,
#               validation/sampling.py); other quantities get a descriptive name
#   mean, sd    as reported; null when not reported (never filled in)
#   lo, hi      a reported range or interval; its kind is stated in `note`
#   n           participants behind the value (the subgroup, if `sex` is set); null if not reported
#   sex         f | m | all
#   population, method, key (BibTeX key in references.bib), note
#
# Comparability: the definitions differ between sources (maximal vs self-paced, straight-line
# vs vertical component vs curvilinear path, interincisal vs incisor-point excursion). The
# `method` and `note` fields say which; compare a dataset value only with a matching definition.
# The dataset's workspace values are task-based lower bounds, not maximal-effort ROM (D1).

