# Jaw geometry (references R1-R6 there, verified 2026-10-31); read by the view
# kin_geometry_lit: metric -> list of {value | low/high, ref, label}. The Balkwill angle
# depends on the condylar reference point (top vs centre) and on the molar of the occlusal plane
# (Balkwill and Shan et al.: second molars, as our landmarks; Ricketts: first): compare, never
# "agree with" one.
geometry:
  bonwill_side_mm:
    - {value: 101.6, ref: "Bonwill 1899", label: "equilateral triangle, 4 in"}
  balkwill_deg:
    - {value: 26.0, ref: "Balkwill 1866", label: "condylar top; occlusal plane through the second molars"}
    - {value: 18.0, low: 12.0, high: 24.0, ref: "Bergström 1950", label: "condylar centre"}
    - {low: 20.3, high: 21.6, ref: "Ohm and Silness 1982", label: "condylar centre, women / men"}
    - {low: 21.3, high: 23.1, ref: "Shan et al. 2025", label: "cephalometric, condylar centre, second molars; class I / II div. 2"}
