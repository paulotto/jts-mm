# Value vocabularies: what a stored categorical value reads as in every figure,
# table, caption, video and the viewer. One place, so a task, muscle or estimator has the same
# name everywhere. Each domain maps a stored value to its reader label; an entry may also give
# `short` (tight axes, legends) and `title` (capitalized, video and panel titles).
#   value: "label"                    or
#   value: {label: "...", short: "...", title: "..."}
# `columns` names the domain of each categorical table column, so `vocab.cell` can translate
# table cells. A value missing from its domain is reported by `check-outputs` (no silent
# fallback in paper items).

