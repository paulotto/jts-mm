[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomech"
version = "0.1.0"
description = "Jaw biomechanics and neuromechanics analysis over recorded JTS-MM sessions"
readme = "README.md"
requires-python = ">=3.10"
# Also needs the in-repo `jtsmm` and `jts` packages, which are not on PyPI:
#   pip install -e software/jtsmm -e software/jaw_tracking -e software/biomech
# Core = what the experiment scripts need (session IO, EMG chain, kinematics);
# light enough for the Pi. The stage pipeline, result store and statistics need
# the `pipeline` extra (pandas/pyarrow/joblib).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
pipeline = ["pandas>=2.0", "pyarrow>=15", "joblib>=1.3", "threadpoolctl>=3.1",
            "zstandard>=0.22"]   # snapshot archives (biomech bundle --archive)
stats = ["statsmodels>=0.14", "pingouin>=0.5", "spm1d>=0.4"]
plot = ["matplotlib>=3.7"]          # TikZ export compiles with pdflatex/latexmk + pgfplots
# Phase-2 analysis viewer (biomech view); see docs/analysis/an09_viewer.md.
viewer = ["dash>=2.17", "plotly>=5.20", "plotly-resampler>=0.10", "diskcache>=5.6"]
dev = ["pytest>=7.0", "pytest-cov>=4", "ruff>=0.4"]
# Everything the ICORR analysis, export and viewer use (videos also need the ffmpeg binary).
all = ["biomech[pipeline,stats,plot,viewer]"]

[project.scripts]
biomech = "biomech.cli:main"

[tool.setuptools.package-data]
"biomech" = ["etc/*.yaml"]
"biomech.viewer" = ["assets/*.css"]
"biomech.norms" = ["norms.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["biomech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: end-to-end runs on synthetic participants",
    "ml: ML tests (slow; run at the end of a change set)",
]
# Fast by default; the full selection is `pytest -m "slow or ml or not slow"` (CI).
addopts = "-m 'not slow and not ml'"

[tool.ruff]
line-length = 100
target-version = "py310"
